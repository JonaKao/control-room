[package]
name = "control-room"
version = "0.1.4"
edition = "2021"
description = "The Agent Control Room: a live view of every project's agent loop"
publish = false

[lib]
name = "control_room"
path = "src/lib.rs"

[[bin]]
name = "control-room"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
regex = "1"
form_urlencoded = "1"
wait-timeout = "0.2"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-window-state = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }
tauri-winrt-notification = "0.8"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
