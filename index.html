<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Tokens from design/DESIGN.md. Dark is the default; light through the theme switch. */
:root {
  --bg: #0C1320; --panel: #121C2C; --panel2: #18243A;
  --ink: #E6ECF4; --muted: #8796AB; --rule: #24324A; --grid: #1C2940;
  --plan: #6F7F96; --change: #5B93E6; --test: #F0A92E; --review: #A07CF0; --polish: #EC6E9B;
  --pass: #35C08E; --fail: #F0614E; --accent: #5B93E6; --glow: rgba(91, 147, 230, .14);
  --cond: "IBM Plex Sans Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --sans: "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, "DejaVu Sans Mono", monospace;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #E4E8EC; --panel: #F7F8F9; --panel2: #EEF1F4;
  --ink: #111A26; --muted: #5E6B7B; --rule: #CBD3DC; --grid: #DCE2E8;
  --plan: #8A97A8; --change: #2F62A8; --test: #C98510; --review: #7650B5; --polish: #C04E78;
  --pass: #18825F; --fail: #C33B2C; --accent: #2F62A8; --glow: transparent;
  color-scheme: light;
}
/* Older names, kept so every part reads the same tokens. */
:root { --paper: var(--bg); --track: var(--grid); --code-bg: var(--panel2); --active: var(--test); }
/* Plots are images drawn on white, in both themes; the picture viewer keeps that white. */
:root { --plot-bg: #FFFFFF; --plot-ink: #111A26; --backdrop: rgba(6, 10, 18, 0.75); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code { font: 12px var(--mono); background: var(--panel2); padding: 1px 5px; border-radius: 4px; }
.num, .t, time { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100vh; }

/* Left rail */
.rail { border-right: 1px solid var(--rule); padding: 20px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: linear-gradient(var(--panel), var(--bg)); }
.brand { display: flex; align-items: center; gap: 10px; margin: 0 4px 16px; }
.logo { width: 28px; height: 28px; border-radius: 7px; flex: none; position: relative;
  background: conic-gradient(var(--change) 0 30%, var(--test) 0 55%, var(--review) 0 75%, var(--pass) 0); }
.logo::after { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--panel); }
.brand .bt { min-width: 0; flex: 1; }
.rail h1 { font: 700 15px/1.15 var(--cond); letter-spacing: .03em; text-transform: uppercase; margin: 0; }
.rail .sub { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#theme { background: none; border: 1px solid var(--rule); border-radius: 7px; width: 28px; height: 28px; padding: 0; cursor: pointer; color: var(--muted); flex: none; display: grid; place-items: center; }
#theme svg { width: 15px; height: 15px; }
#theme:hover { color: var(--ink); }
.fleet { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 0 4px 6px; }
.fleet > div { background: var(--panel2); border-radius: 8px; padding: 7px 7px; min-width: 0; }
.fleet b { display: block; font: 700 20px/1 var(--cond); font-variant-numeric: tabular-nums; }
.fleet span { display: block; font-size: 10.5px; color: var(--muted); line-height: 1.25; margin-top: 3px; }
.fleet .f-need b { color: var(--fail); } .fleet .f-need.calm b { color: var(--ink); }
.fleet .f-work b { color: var(--test); } .fleet .f-done b { color: var(--pass); }
.fleet-words { font-size: 11.5px; color: var(--muted); margin: 0 4px 6px; }
.proj { display: grid; grid-template-columns: 10px minmax(0, 1fr) 64px; gap: 2px 10px; align-items: center;
  width: 100%; text-align: left; background: none; border: 0; padding: 8px; border-radius: 8px; cursor: pointer; }
.proj:hover { background: var(--panel2); }
.proj[aria-current="true"] { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent), 0 0 0 1px var(--rule); }
.proj .name { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj .meta { grid-column: 2; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj .mini { grid-column: 3; grid-row: 1 / 3; display: block; width: 64px; height: 22px; }
.proj.ws { grid-template-columns: 10px minmax(0, 1fr); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rule); flex: none; }
.dot.busy { background: var(--test); }
.dot.ask { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.dot.ok { background: var(--pass); }
.dot.bad { background: var(--fail); box-shadow: 0 0 0 3px color-mix(in srgb, var(--fail) 25%, transparent); }
.dot.ws { background: none; border: 2px solid var(--accent); border-radius: 3px; }
.group-label { font: 600 11px var(--cond); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 14px 8px 4px; }

/* Main: a 12-column grid of panels */
main { padding: 18px 24px 48px; min-width: 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
  grid-auto-rows: min-content; gap: 12px; align-content: start; }
main > * { grid-column: 1 / -1; min-width: 0; }
.slot { display: flex; flex-direction: column; }
.slot > .card { flex: 1 1 auto; }
.slot:empty { display: none; }
.card, .panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 13px 15px; min-width: 0;
  box-shadow: 0 0 0 1px var(--glow); }
.ph { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin: 0 0 9px; min-width: 0; }
.ph h3 { font: 600 12.5px var(--cond); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; white-space: nowrap; }
.ph .pm { font-size: 11.5px; color: var(--muted); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
summary { cursor: pointer; }
.more-link > summary, .card details > summary { color: var(--accent); font-size: 12.5px; }

@media (min-width: 1200px) {
  .c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; }
  /* The four numbers alone in the panel; what each means is in its tooltip and on phones. */
  [data-section="record"] .kpi .kd { display: none; }
  .c5 { grid-column: span 5; } .c4 { grid-column: span 4; } .c3 { grid-column: span 3; }
}

/* Hero: the summary at a glance */
.hero { position: relative; overflow: hidden; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 22px; padding: 16px 20px 14px 22px; }
.hero::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--tone, var(--rule)); }
.hero.with-action { grid-template-columns: minmax(0, 1fr); }
.hero.with-action .hero-side { display: none; }
.crumb { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; font-size: 12px; color: var(--muted); }
.crumb .pname { font-weight: 600; color: var(--ink); }
.title { font: 700 29px/1.1 var(--cond); letter-spacing: -.005em; margin: 6px 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.chip { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px;
  color: var(--tone, var(--muted)); background: color-mix(in srgb, var(--tone, var(--muted)) 16%, transparent); white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.needs { display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px 3px 7px; border-radius: 99px; font-weight: 600; font-size: 12.5px; }
.needs svg { width: 16px; height: 16px; flex: none; }
.needs[data-needs="no"] { background: color-mix(in srgb, var(--pass) 14%, transparent); color: var(--pass); }
.needs.t-ask { background: color-mix(in srgb, var(--accent) 17%, transparent); color: var(--accent); }
.needs.t-bad { background: color-mix(in srgb, var(--fail) 16%, transparent); color: var(--fail); }
.task-line { margin: 9px 0 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-line .lbl { color: var(--muted); }
.now-line { margin: 4px 0 0; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.now-line b { color: var(--ink); font-weight: 600; }
.now-line svg { width: 14px; height: 14px; margin-right: 5px; vertical-align: -2px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.now-line.ask, .now-line.ask b { color: var(--accent); }
.now-line .q { margin-left: 8px; color: var(--test); font-weight: 600; }
.hero-side { min-width: 0; border-left: 1px solid var(--grid); padding-left: 20px; }
.hero-side .agent-note { margin: 0 0 8px; font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.plan-steps { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.plan-steps li { display: grid; grid-template-columns: 18px 14px minmax(0, 1fr); gap: 4px; padding: 2px 0; color: var(--muted); }
.plan-steps li span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plan-steps li.d { color: var(--ink); }
.plan-steps li.cur { color: var(--ink); font-weight: 600; }
.plan-steps b { font: 500 11px var(--mono); color: var(--muted); }
.plan-bar { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; margin: 2px 0 8px; }
.plan-bar span { display: block; height: 100%; background: var(--tone, var(--test)); border-radius: 4px; }
.est-wait { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

/* Loop stepper */
.steps { list-style: none; margin: 14px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); }
.steps li { position: relative; text-align: center; font-size: 11.5px; color: var(--muted); padding-top: 21px; line-height: 1.3; }
.steps li::before { content: ""; position: absolute; top: 7px; right: calc(50% + 11px); width: calc(100% - 22px); height: 2px; background: var(--rule); }
.steps li:first-child::before { display: none; }
.steps li.past::before, .steps li.now::before { background: var(--pass); }
.steps .node { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 16px; height: 16px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--rule); z-index: 1; }
.steps li.past .node { background: var(--pass); border-color: var(--pass); }
.steps li.now .node { background: var(--tone, var(--test)); border-color: var(--tone, var(--test));
  box-shadow: 0 0 0 5px color-mix(in srgb, var(--tone, var(--test)) 22%, transparent); animation: pulse 1.8s ease-in-out infinite; }
.steps li.now { color: var(--ink); font-weight: 600; }
.steps li.tried::before { background: color-mix(in srgb, var(--muted) 45%, var(--rule)); }
.steps li.tried .node { background: color-mix(in srgb, var(--muted) 45%, var(--panel)); border-color: color-mix(in srgb, var(--muted) 45%, var(--panel)); }
.steps li.end-ok .node { background: var(--pass); border-color: var(--pass); animation: none; box-shadow: none; }
.steps li.end-ask .node { background: var(--accent); border-color: var(--accent); animation: none; }
.steps li.end-bad::before { background: var(--rule); }
.steps li.end-bad .node { background: var(--fail); border-color: var(--fail); animation: none; }
.steps .hint { display: block; font-weight: 400; font-size: 11px; color: var(--muted); }
.loop-cap { margin: 6px 0 0; font-size: 11px; color: var(--muted); text-align: center; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--tone, var(--test)) 8%, transparent); } }
@media (prefers-reduced-motion: reduce) { .steps li.now .node, .tt-end.o-running span { animation: none !important; } }

/* What to do */
.action { border: 1.5px solid var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--panel)); padding: 13px 16px; }
.action.t-bad { border-color: var(--fail); background: color-mix(in srgb, var(--fail) 6%, var(--panel)); }
.action h3 { margin: 0 0 2px; font: 700 17px/1.2 var(--cond); }
.action .lead, .action p { margin: 0 0 5px; font-size: 12.5px; line-height: 1.4; }
.action .lead { color: var(--muted); }
.draft { border-top: 1px solid var(--rule); padding: 6px 0 0; }
.draft:first-of-type { border-top: 0; padding-top: 2px; }
.draft .issue { font-weight: 700; font-size: 14px; }
.safe { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--pass); font-weight: 600; }
.choices { display: grid; gap: 6px; margin: 5px 0 2px; }
.choice { min-width: 0; }
.choice b { font-size: 12.5px; }
.choice .why { display: inline; font-size: 12px; color: var(--muted); margin-left: 6px; }
.copy-row { display: flex; gap: 8px; align-items: center; margin-top: 3px; }
.copy-row code { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.copy-row button { border: 0; border-radius: 6px; padding: 4px 11px; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--panel); flex: none; }
.how { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
.wait-card h3 { margin: 0 0 4px; }
.action .wait-card + .wait-card, .action .wait-card + h3 { margin-top: 12px; }
.action details { font-size: 12.5px; }

/* Step by step */
.kicon { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; flex: none; background: var(--panel2); color: var(--muted); }
.kicon svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.kicon.k-read, .kicon.k-search, .kicon.k-plan, .kicon.k-web { background: var(--plan); color: var(--panel); }
.kicon.k-edit { background: var(--change); color: var(--panel); }
.kicon.k-test, .kicon.k-command { background: var(--test); color: var(--panel); }
.kicon.k-agent { background: var(--review); color: var(--panel); }
.kicon.k-waiting { background: var(--accent); color: var(--panel); }
[data-subagent="reviewer"] > .kicon { background: var(--review); color: var(--panel); }
.live .current { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 11px; align-items: center; padding: 9px 10px; border-radius: 9px; background: var(--panel2); }
.live .current .kicon { width: 30px; height: 30px; border-radius: 8px; }
.live .current .kicon svg { width: 16px; height: 16px; }
.live .current .lbl { font-size: 11.5px; color: var(--muted); }
.live .current .ctext { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; line-height: 1.3; }
.live .current[data-attention="yes"] { border: 2px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--panel2)); }
.live .current[data-attention="yes"] .lbl { color: var(--accent); font-weight: 600; }
.live .cmd { margin-top: 3px; font-size: 12px; }
.live .cmd summary { color: var(--muted); }
.live .cmd code { display: inline-block; margin-top: 3px; overflow-wrap: anywhere; white-space: normal; }
.live .quiet { margin: 8px 0 0; padding: 7px 10px; border-radius: 8px; font-size: 12.5px; background: color-mix(in srgb, var(--test) 15%, transparent); }
.step-list { list-style: none; margin: 6px 0 0; padding: 0; }
.step-list li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 3px 2px; border-top: 1px solid var(--grid); font-size: 12.5px; }
.step-list .stext { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.step-list .t { color: var(--muted); font: 11px var(--mono); }
.live details[data-detail="steps"] > summary { color: var(--muted); font-size: 12px; padding: 4px 0 0; }
.who { display: inline-flex; align-items: center; gap: 3px; margin-left: 6px; padding: 0 6px; border-radius: 4px; font-size: 11px; font-weight: 600;
  white-space: nowrap; vertical-align: 1px; color: var(--muted); background: var(--panel2); }
.who.rev { color: var(--review); background: color-mix(in srgb, var(--review) 18%, transparent); }
.who svg { width: 11px; height: 11px; }

/* Tests */
.ring { display: flex; gap: 12px; align-items: center; }
.donut { width: 52px; height: 52px; flex: none; }
.ring .big { font: 700 24px/1 var(--cond); font-variant-numeric: tabular-nums; }
.ring .small { font-size: 12px; color: var(--muted); margin-top: 3px; }
.tests { list-style: none; margin: 8px 0 0; padding: 0; font-size: 12.5px; }
.tests li { display: flex; gap: 7px; align-items: center; padding: 2px 0; border-top: 1px solid var(--grid); min-width: 0; }
.tests li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tests li .mk, .mk { width: 14px; height: 14px; flex: none; }
.tests-more > summary { font-size: 12px; padding: 3px 0; }
.history .bars { display: flex; gap: 2px; align-items: flex-end; height: 22px; margin-top: 7px; }
.history .bars span { flex: 1 1 0; max-width: 18px; min-height: 3px; border-radius: 1px; background: var(--pass); }
.history .bars span.f { background: var(--fail); }
.history .cap { font-size: 11px; color: var(--muted); margin-top: 3px; }
.facts2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; margin-top: 7px; padding-top: 6px; border-top: 1px solid var(--grid); }
.facts2 .fl { font: 600 10.5px var(--cond); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.facts2 .fv { font-size: 12.5px; font-weight: 600; display: flex; gap: 5px; align-items: center; margin-top: 2px; }
.facts2 .fs { font-size: 11px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { width: 16px; height: 16px; flex: none; }
.pips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; }
.pips span { width: 10px; height: 10px; border-radius: 3px; background: var(--grid); }
.pips span.used { background: color-mix(in srgb, var(--muted) 60%, var(--grid)); }
.pips span.used.last { background: var(--test); }
.pips span.used.last-ok { background: var(--pass); }
.pips span.used.last-bad { background: var(--fail); }
.pips span.used.last-ask { background: var(--accent); }
.health details { margin-top: 6px; }
pre.out { margin: 6px 0 0; padding: 10px 12px; background: var(--panel2); border-radius: 8px;
  font: 11.5px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }
.health .small { font-size: 12px; color: var(--muted); margin: 6px 0 0; }

/* Where the time went */
.tt-list { display: grid; }
.tt-row { display: grid; grid-template-columns: 168px minmax(0, 1fr) 76px; gap: 0 10px; align-items: center; padding: 2px 0; min-width: 0; }
.tt-head { min-width: 0; line-height: 1.25; }
.tt-head .tt-name { display: block; font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt-head .tt-sub { display: block; font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tt-out { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; vertical-align: -2px; }
.tt-out svg { width: 11px; height: 11px; }
.tt-out.o-done { color: var(--pass); } .tt-out.o-waiting { color: var(--accent); } .tt-out.o-stuck { color: var(--fail); } .tt-out.o-running { color: var(--test); }
.tt-track { position: relative; display: flex; align-items: center; height: 30px; padding-top: 10px; min-width: 0; }
.tt-bar { display: flex; height: 14px; flex: none; gap: 0; }
.tt-seg { flex: var(--d) 1 0; min-width: 2px; height: 100%; border: 0; padding: 0; margin: 0; cursor: pointer; position: relative;
  background: var(--c); box-shadow: inset -1px 0 0 var(--panel); }
.tt-seg:first-child { border-radius: 3px 0 0 3px; }
.tt-seg:last-child { border-radius: 0 3px 3px 0; box-shadow: none; }
.tt-seg:only-child { border-radius: 3px; }
.tt-seg:hover { filter: brightness(1.1); }
.tt-seg[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; z-index: 2; }
.tt-seg.att::before { content: ""; position: absolute; left: -1px; top: -4px; bottom: -2px; width: 2px; background: var(--ink); border-radius: 1px; }
.tt-seg [data-attempt-mark] { position: absolute; left: -3px; top: -14px; font: 600 9.5px/1 var(--mono); color: var(--muted); }
.tt-gap { flex: 0 0 14px; height: 14px; border: 0; padding: 0; margin: 0 2px; cursor: pointer; border-radius: 2px;
  background: repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 5px); opacity: .7; }
.tt-gap[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.tt-end { flex: none; width: 14px; height: 14px; margin-left: 4px; display: inline-flex; }
.tt-end svg { width: 14px; height: 14px; }
.tt-end.o-done { color: var(--pass); } .tt-end.o-waiting { color: var(--accent); } .tt-end.o-stuck { color: var(--fail); }
.tt-end.o-running span { width: 8px; height: 8px; margin: 3px; border-radius: 50%; background: var(--test);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--test) 25%, transparent); animation: pulse 1.8s ease-in-out infinite; }
.tt-total { font: 500 11.5px var(--mono); color: var(--muted); text-align: right; padding-top: 10px; white-space: nowrap; }
.tt-detail { grid-column: 1 / -1; margin: 4px 0 6px; padding: 8px 12px; border-radius: 9px; background: var(--panel2); border-left: 4px solid var(--c, var(--rule)); font-size: 13px; }
.tt-detail p { margin: 0; }
.tt-detail .tt-dt { color: var(--muted); font-size: 12px; margin-bottom: 3px; }
.tt-detail ul { margin: 4px 0 0; padding-left: 18px; }
.tt-axis { position: relative; height: 18px; margin: 4px 86px 0 178px; border-top: 1px solid var(--grid); font: 10.5px var(--mono); color: var(--muted); }
.tt-axis span { position: absolute; top: 3px; transform: translateX(-50%); white-space: nowrap; }
.tt-axis span:first-child { transform: none; }
.tt-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 14px; margin-top: 4px; }
.tt-cap { font-size: 11px; color: var(--muted); margin: 0; }
.tt-legend { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11px; color: var(--muted); }
.tt-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
.tt-legend .k-gap i { background: repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 4px); }
.tt-legend .k-att i { width: 2px; background: var(--ink); border-radius: 1px; }
.tt-older > summary { font-size: 12px; padding: 2px 0; }

/* Where the agent works */
.map-top { margin-bottom: 6px; }
@media (min-width: 1200px) {
  .map-card { display: flex; flex-direction: column; }
  .map-card .map { flex: 1 1 auto; min-height: 70px; }
  .action .choices { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
  .action .choice .why { display: block; margin: 1px 0 0; }
}
.map-intro { margin: 0; font-size: 11.5px; color: var(--muted); }
.map-toggle { border: 1px solid var(--rule); background: transparent; color: var(--accent); border-radius: 99px; padding: 1px 9px; font-size: 11.5px; font-weight: 600; cursor: pointer; flex: none; }
.map-toggle[aria-pressed="false"] { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.map { position: relative; width: 100%; border-radius: 6px; overflow: hidden; background: var(--bg); }
.map-group { position: absolute; border-radius: 4px; background: var(--bg); }
.map-gl { position: absolute; left: 3px; top: 2px; z-index: 2; pointer-events: none; font: 600 10px var(--mono); color: var(--ink);
  background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 0 4px; border-radius: 3px; max-width: calc(100% - 6px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map-tile { position: absolute; border: 0; margin: 0; padding: 0; border-radius: 3px; cursor: pointer; overflow: hidden; text-align: left; background: var(--grid); color: var(--ink); }

.map-tile:hover { filter: brightness(1.08); }
.map-tile[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: -2px; z-index: 3; }
.map-tile .mn { position: absolute; left: 4px; right: 4px; bottom: 2px; font: 500 10px/1.25 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map-tile .ms { display: block; opacity: .8; }
.map-detail { margin-top: 8px; padding: 8px 12px; border-radius: 9px; background: var(--panel2); border-left: 4px solid var(--change); font-size: 12.5px; }
.map-detail p { margin: 0; }
.map-detail .path { font: 600 12px var(--mono); overflow-wrap: anywhere; }
.map-detail .sub { color: var(--muted); font-size: 12px; }
.map-legend { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-size: 11px; color: var(--muted); margin-top: 6px; }
.map-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 3px; vertical-align: -1px; }
.map-legend i.s0 { background: var(--grid); }
.map-legend i.s1 { background: color-mix(in srgb, var(--change) 16%, var(--panel)); }
.map-legend i.s2 { background: color-mix(in srgb, var(--change) 34%, var(--panel)); }
.map-legend i.s3 { background: color-mix(in srgb, var(--change) 54%, var(--panel)); }
.map-legend i.s4 { background: color-mix(in srgb, var(--change) 76%, var(--panel)); }
.map-legend i.s5 { background: var(--change); }

/* Track record */
.rec-intro { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
.kpi { background: var(--panel2); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.kpi .kv { font: 700 22px/1.05 var(--cond); font-variant-numeric: tabular-nums; }
.kpi .kv small { font: 500 13px var(--sans); color: var(--muted); }
.kpi[data-kpi="first-try"] .kv { color: var(--pass); }
.kpi[data-kpi="rejected"] .kv, .kpi[data-kpi="stuck"] .kv { color: var(--fail); }
.kpi.zero .kv { color: var(--ink); }
.kpi .kl { font-size: 11.5px; font-weight: 600; line-height: 1.25; margin-top: 2px; }
.kpi .kd { font-size: 10.5px; color: var(--muted); line-height: 1.25; margin-top: 1px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.kpi .meter { height: 3px; border-radius: 2px; background: var(--grid); margin-top: 5px; overflow: hidden; }
.kpi .meter span { display: block; height: 100%; border-radius: 2px; }
.rec-h { font: 600 11px var(--cond); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 10px 0 4px; }
.trend { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 6px; }
.trend .axis { display: flex; flex-direction: column; justify-content: space-between; height: 56px; padding-top: 10px; margin-bottom: -6px; font: 10px var(--mono); color: var(--muted); text-align: right; }
.trend .cols { display: flex; gap: 3px; align-items: flex-end; height: 56px; padding-top: 12px; border-bottom: 1px solid var(--grid); min-width: 0; }
.trend .col { flex: 1 1 0; max-width: 28px; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: stretch;
  border: 0; padding: 0; margin: 0; background: none; cursor: pointer; position: relative; }
.trend .col .b { display: block; height: var(--h); border-radius: 2px 2px 0 0; background: var(--c); min-height: 2px; }
.trend .col .n { position: absolute; left: 0; right: 0; bottom: calc(var(--h) + 1px); font: 600 9.5px/1.3 var(--mono); color: var(--muted); text-align: center; }
.trend .col:hover .b { filter: brightness(1.1); }
.trend .col[aria-pressed="true"] .b { outline: 2px solid var(--ink); outline-offset: 1px; }
.trend .marks { grid-column: 2; display: flex; gap: 3px; min-width: 0; padding-top: 3px; }
.trend .marks > span { flex: 1 1 0; max-width: 28px; min-width: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 1px; }
.trend .marks i { width: 5px; height: 5px; border-radius: 50%; background: var(--pass); }
.trend .marks i.f { background: var(--fail); }
.trend .marks i.dr { border-radius: 1px; background: var(--accent); }
.trend .marks i.st { border-radius: 0; background: none; width: 0; height: 0; border: 3px solid transparent; border-bottom: 5px solid var(--fail); border-top: 0; }
.rec-cap { font-size: 11px; color: var(--muted); margin: 4px 0 0; }
.rec-legend { display: flex; flex-wrap: wrap; gap: 1px 9px; font-size: 10.5px; color: var(--muted); margin-top: 3px; }
.rec-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 0; }
.rec-legend i.dot-p { border-radius: 50%; background: var(--pass); width: 6px; height: 6px; }
.rec-legend i.dot-f { border-radius: 50%; background: var(--fail); width: 6px; height: 6px; }
.rec-legend i.dr { background: var(--accent); width: 6px; height: 6px; border-radius: 1px; }
.rec-legend i.st { width: 0; height: 0; border-radius: 0; border: 3px solid transparent; border-bottom: 5px solid var(--fail); border-top: 0; }
.rec-detail { margin-top: 8px; padding: 8px 12px; border-radius: 9px; background: var(--panel2); border-left: 4px solid var(--c, var(--rule)); font-size: 12.5px; }
.rec-detail p { margin: 0; }
.rec-detail .sub { color: var(--muted); font-size: 12px; }
.rec-detail ul { margin: 4px 0 0; padding-left: 18px; }
.rec-why { margin-top: 8px; }
.rec-why > summary { font-size: 12px; }
.rec-why > .empty { font-size: 12px; }
.reasons { list-style: none; margin: 6px 0 0; padding: 0; }
.reasons > li { border-top: 1px solid var(--grid); padding: 8px 0; }
.reasons > li:first-child { border-top: 0; padding-top: 2px; }
.reason-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(50px, 160px) 24px; gap: 10px; align-items: center; }
.reason-top b { font-size: 13px; }
.reason-bar { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.reason-bar span { display: block; height: 100%; background: var(--fail); border-radius: 3px; }
.reason-top .rn { font: 700 14px var(--cond); text-align: right; font-variant-numeric: tabular-nums; }
.reason-hint { font-size: 12.5px; margin: 3px 0 0; }
.reason-hint .in-done { color: var(--muted); }
.reasons details { margin-top: 3px; font-size: 12.5px; }
.reasons details ul { margin: 3px 0 0; padding-left: 18px; }
.reasons details .when { color: var(--muted); font-size: 11.5px; }
.ws-rows { display: grid; }
.ws-row { display: grid; grid-template-columns: minmax(110px, 1.2fr) minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1.4fr); gap: 6px 18px; align-items: center; padding: 10px 0; border-top: 1px solid var(--grid); }
.ws-row:first-child { border-top: 0; }
.ws-row .wn { border: 0; background: none; padding: 0; text-align: left; font-weight: 700; font-size: 14px; color: var(--accent); cursor: pointer; overflow-wrap: anywhere; }
.ws-row .wn small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.ws-cell { font-size: 12.5px; color: var(--muted); min-width: 0; }
.ws-cell b { color: var(--ink); font-size: 13.5px; }
.ws-cell .meter { height: 4px; border-radius: 2px; background: var(--grid); margin-top: 5px; overflow: hidden; }
.ws-cell .meter span { display: block; height: 100%; }
.spark { display: flex; gap: 2px; align-items: flex-end; height: 26px; margin-top: 3px; }
.spark span { flex: 1 1 0; max-width: 10px; min-height: 3px; border-radius: 1px 1px 0 0; background: var(--c); }
.ws-none { font-size: 12.5px; color: var(--muted); margin: 10px 0 0; }
.ws-hero .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 14px; }
.ws-lead { margin: 0; font-size: 14px; }

/* Pictures */
.plots { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.plot { margin: 0; background: var(--panel2); border-radius: 9px; overflow: hidden; border: 1px solid var(--rule); }
.plot button { display: block; width: 100%; padding: 0; border: 0; background: var(--plot-bg); cursor: zoom-in; }
.plot img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; }
.plot figcaption { padding: 6px 10px; font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
.plot figcaption span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); font-size: 11px; }
.plot figcaption span:last-child { color: var(--muted); white-space: nowrap; }
dialog { border: 0; padding: 0; border-radius: 12px; max-width: 92vw; max-height: 92vh; background: var(--plot-bg); }

/* More detail */
.more { padding: 0; }
.more > .ph { padding: 13px 15px 0; }
.more > details { border-top: 1px solid var(--grid); }
.more > details > summary { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) auto 14px; gap: 12px; align-items: center; padding: 11px 15px; color: var(--ink); }
.more > details > summary > span:first-child { min-width: 0; }
.more > details > summary::-webkit-details-marker { display: none; }
.more summary .st { font-weight: 600; font-size: 14px; }
.more summary .teaser { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.more summary .n { font-size: 12px; color: var(--muted); }
.chev { width: 8px; height: 8px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
details[open] > summary .chev { transform: rotate(45deg); }
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
.more .body { padding: 0 15px 14px; }
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: var(--rule); }
.timeline li { position: relative; padding: 0 0 12px 24px; }
.timeline li::before { content: ""; position: absolute; left: 0; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }
.timeline .dt { font: 11px var(--mono); color: var(--muted); }
.timeline .dtitle { font-weight: 600; }
.timeline .dbody { font-size: 13px; color: var(--muted); margin-top: 2px; }
.md { font-size: 13.5px; max-width: 80ch; }
.md h1 { font: 700 17px var(--cond); margin: 0 0 8px; }
.md h2 { font: 600 15px var(--cond); margin: 14px 0 6px; }
.md h3 { font-size: 13.5px; margin: 12px 0 4px; }
.md p { margin: 0 0 8px; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 20px; }
.md li.task-item { list-style: none; margin-left: -20px; }
.md pre { background: var(--panel2); padding: 10px 12px; border-radius: 8px; overflow: auto; font: 12px var(--mono); }
.activity { list-style: none; margin: 0; padding: 0; }
.activity li { display: grid; grid-template-columns: 70px 10px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--grid); font-size: 13px; }
.activity li:first-child { border-top: 0; }
.activity .t { color: var(--muted); font: 11px var(--mono); }
.activity .k { width: 8px; height: 8px; border-radius: 2px; background: var(--muted); transform: translateY(-1px); }
.activity .k.decision { background: var(--ink); }
.activity .k.draft { background: var(--accent); }
.activity .k.bad { background: var(--fail); }
.activity .k.good { background: var(--pass); }
.activity span:last-child { overflow-wrap: anywhere; }

/* Git: saved versions */
.git-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px 24px; align-items: start; }
.sync { display: grid; grid-template-columns: auto minmax(90px, 1fr) auto; align-items: center; gap: 10px; }
.place { border: 1px solid var(--rule); border-radius: 9px; padding: 7px 12px; text-align: center; font-size: 12.5px; font-weight: 600; background: var(--panel2); }
.place small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.place.dirty { border-color: var(--test); }
.lanes { display: grid; gap: 6px; font-size: 12px; color: var(--muted); text-align: center; }
.lane { position: relative; padding-bottom: 6px; }
.lane::after { content: ""; position: absolute; left: 0; right: 8px; bottom: 0; height: 2px; background: var(--rule); }
.lane::before { content: ""; position: absolute; right: 0; bottom: -4px; border: 5px solid transparent; border-left: 8px solid var(--rule); border-right: 0; }
.lane.back::after { left: 8px; right: 0; }
.lane.back::before { left: 0; right: auto; border-left: 0; border-right: 8px solid var(--rule); }
.lane.on { color: var(--ink); font-weight: 600; }
.lane.on::after { background: var(--accent); }
.lane.on::before { border-left-color: var(--accent); }
.lane.back.on::before { border-right-color: var(--accent); border-left-color: transparent; }
.sync-words { margin: 10px 0 0; font-size: 13.5px; }
.git-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.git-actions button { border: 1px solid var(--accent); background: var(--accent); color: var(--panel); border-radius: 8px; padding: 6px 14px; font-weight: 600; font-size: 13px; cursor: pointer; }
.git-actions button.secondary { background: transparent; color: var(--accent); }
.git-actions button:disabled { opacity: .45; cursor: not-allowed; }
.git-why { font-size: 12px; color: var(--muted); margin: 6px 0 0; text-align: right; }
.git-link { font-size: 13px; color: var(--accent); }
.git-msg { margin: 10px 0 0; padding: 7px 12px; border-radius: 8px; font-size: 13px; background: color-mix(in srgb, var(--pass) 14%, transparent); }
.git-msg.bad { background: color-mix(in srgb, var(--fail) 14%, transparent); }
.git-files ul { margin: 6px 0 0; padding-left: 20px; font: 12px var(--mono); }
.git-files summary { color: var(--accent); font-size: 13px; margin-top: 10px; }
.tl-wrap { overflow-x: auto; margin-top: 14px; padding: 4px 2px 2px; }
.tl { display: inline-flex; align-items: center; gap: 0; position: relative; height: 40px; }
.tl::before { content: ""; position: absolute; left: 12px; right: 12px; top: 50%; height: 2px; background: var(--rule); }
.tl button { position: relative; width: 28px; height: 28px; flex: none; border: 0; background: none; padding: 0; cursor: pointer; display: grid; place-items: center; }
.tl button + button { margin-left: 12px; }
.tl .pt { width: 14px; height: 14px; border-radius: 50%; background: var(--rule); border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--rule); }
.tl [data-state="ok"] .pt { background: var(--pass); box-shadow: 0 0 0 1px var(--pass); }
.tl [data-state="tested"] .pt { background: var(--test); box-shadow: 0 0 0 1px var(--test); }
.tl [data-state="bad"] .pt { background: var(--fail); box-shadow: 0 0 0 1px var(--fail); }
.tl [data-pushed="no"] .pt { outline: 2px dashed var(--accent); outline-offset: 3px; }
.tl button[aria-pressed="true"] .pt { transform: scale(1.35); }
.tl-ends { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--muted); margin-top: 2px; }
.tl-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.tl-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.commit-detail { margin-top: 12px; border-top: 1px solid var(--grid); padding-top: 10px; }
.commit-detail .subj { font-weight: 700; font-size: 15px; overflow-wrap: anywhere; }
.commit-detail .meta { font-size: 12.5px; color: var(--muted); margin: 2px 0 8px; }
.commit-detail .facts .mk { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }
.commit-detail .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; margin-bottom: 8px; }
.commit-detail ul { margin: 4px 0 0; padding-left: 20px; font-size: 13px; }
.commit-detail .why { color: var(--muted); font-size: 12.5px; }
.hint-pick { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }

.welcome { grid-column: 1 / -1; max-width: 60ch; padding-top: 10vh; }
.welcome h2 { font: 700 30px var(--cond); margin: 0 0 12px; }
.welcome ol { padding-left: 20px; }

@media (max-width: 1199px) {
  .hero { grid-template-columns: minmax(0, 1fr); }
  .hero-side { border-left: 0; padding-left: 0; border-top: 1px solid var(--grid); padding-top: 10px; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 12px 16px 10px; }
  .brand { margin: 0 0 8px; }
  .rail .sub, .group-label, .proj .meta, .proj .mini, .fleet-words { display: none; }
  .fleet { margin: 0 0 8px; gap: 5px; }
  .fleet > div { padding: 5px 7px; display: flex; align-items: baseline; gap: 5px; }
  .fleet b { font-size: 16px; }
  .fleet span { margin: 0; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* One row that scrolls on its own, so a long list never pushes the summary down. */
  #projects { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px;
    -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
  #projects::-webkit-scrollbar { display: none; }
  .proj, .proj.ws { flex: none; width: auto; display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border: 1px solid var(--rule); border-radius: 999px; }
  .proj[aria-current="true"] { box-shadow: none; border-color: var(--accent); }
  .proj .name { font-size: 12.5px; }
  main { padding: 12px 16px 40px; gap: 10px; }
  .hero { padding: 13px 14px 12px 16px; }
  .title { font-size: 22px; }
  .steps li { font-size: 11px; }
  .steps .hint, .loop-cap { display: none; }
  .tt-row { grid-template-columns: minmax(0, 1fr) 76px; }
  .tt-head { grid-column: 1 / -1; }
  .tt-axis { margin: 4px 86px 0 0; }
  .git-top { grid-template-columns: minmax(0, 1fr); }
  .git-actions { justify-content: flex-start; }
  .git-why { text-align: left; }
  .ws-hero .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ws-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .ws-row .wn { grid-column: 1 / -1; }
  .reason-top { grid-template-columns: minmax(0, 1fr) 24px; gap: 4px 10px; }
  .reason-top .reason-bar { grid-column: 1 / -1; grid-row: 2; }
  .more > details > summary { padding: 10px 14px; }
  .more .body { padding: 0 14px 12px; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Projects">
    <div class="brand"><span class="logo" aria-hidden="true"></span><div class="bt"><h1>Agent Control Room</h1><span class="sub" id="rail-sub">What each project's agent is doing, live</span></div>
      <button id="theme" type="button" aria-label="Switch between light and dark" title="Switch between light and dark"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.8a6.2 6.2 0 0 1 0 12.4z" fill="currentColor"/></svg></button></div>
    <div id="overview"></div>
    <div id="projects"></div>
  </nav>
  <main id="main" aria-live="polite"></main>
</div>
<dialog id="lightbox"><img alt=""><p></p></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;

// Every phase in plain words: what it means for someone who doesn't know the code.
const PHASES = {
  idle:         { tone: "idle", short: "Not started",          doing: "Not working on anything right now" },
  planning:     { tone: "busy", short: "Planning",             doing: "Planning how to tackle the task" },
  implementing: { tone: "busy", short: "Making a change",      doing: "Making a change to the code" },
  fixing:       { tone: "busy", short: "Polishing",            doing: "Polishing: fixing small points the reviewer raised" },
  checking:     { tone: "busy", short: "Testing",              doing: "Testing its latest change" },
  reviewing:    { tone: "busy", short: "Being reviewed",       doing: "A second, independent agent is reviewing the work" },
  waiting:      { tone: "ask",  short: "Needs your decision",  doing: "Paused until you decide on an unfinished fix" },
  done:         { tone: "ok",   short: "Finished",             doing: "Finished the task" },
  stuck:        { tone: "bad",  short: "Stuck, needs you",     doing: "Stopped: it could not solve this on its own" },
};
const phaseOf = p => PHASES[p] || PHASES.idle;

// Agent-written text (notes, task, events) reworded: framework terms and file names in plain words.
const FILE_WORDS = [[/\b(?:state\/)?progress\.md\b/g, "the progress note"], [/\b(?:state\/)?decisions\.md\b/g, "the decision log"],
  [/\bDONE\.md\b/g, "the definition of done"], [/\bCLAUDE\.md\b/g, "the project instructions"],
  [/\bproject\.json\b/g, "the project settings"], [/\b(?:state\/)?reviews\/latest\.md\b/g, "the review"],
  [/\b(?:state\/)?checks\.json\b/g, "the test results"], [/\b(?:state\/)?check_history\.jsonl\b/g, "the test history"],
  [/\b(?:state\/)?status\.json\b/g, "the status"], [/\b(?:state\/)?events\.jsonl\b/g, "the activity log"],
  [/\b(?:state\/)?review\.json\b/g, "the review"], [/\b(?:framework\/)?aaf\.py\b/g, "the framework tool"], [/\bvia aaf\b/g, "with the framework tool"]];
function plain(t) {
  let s = String(t ?? "");
  for (const [re, words] of FILE_WORDS) s = s.replace(re, words);
  return s.replace(/\biterations?\b/gi, m => /s$/i.test(m) ? "attempts" : "attempt")
    .replace(/^Implementing\b/, "Making a change").replace(/^Checking\b/, "Testing").replace(/^Reviewing\b/, "Being reviewed")
    .replace(/^Fixing\b/, "Polishing").replace(/^Waiting\b/, "Waiting for you").replace(/^Planning\b/, "Planning")
    .replace(/\bimplementing\b/gi, "making a change")
    .replace(/\b(\d+)\s*\/\s*(\d+) checks?\b/gi, "$1 of $2 tests").replace(/\bchecks\b|\bcheck(?= (?:pass|fail|result|run))/gi, m => (m[0] === "C" ? "T" : "t") + "est" + (m.length > 5 ? "s" : ""))
    .replace(/\bdrafts? (fix-(\d+))\b/gi, "unfinished fix $2").replace(/(^|[^\w-])fix-(\d+)\b/gi, "$1fix $2")
    .replace(/\b(\d+) drafts\b/gi, "$1 unfinished fixes").replace(/\b1 draft\b/gi, "1 unfinished fix").replace(/\bno drafts\b/gi, "no unfinished fixes")
    .replace(/\bminor findings?\b/gi, m => /s$/i.test(m) ? "small review points" : "small review point")
    .replace(/\bphase\b/gi, m => m[0] === "P" ? "Stage" : "stage");
}
const needsYou = p => p === "waiting" || p === "stuck";
// One colour per phase (DESIGN.md), the same in the loop, the live steps, the timeline and the rail.
const PHASE_VAR = { planning: "--plan", implementing: "--change", checking: "--test", reviewing: "--review", fixing: "--polish" };
const TONE_VAR = { ask: "--accent", bad: "--fail", ok: "--pass", idle: "--rule" };
const toneVar = (phase, tone) => tone === "busy" ? (PHASE_VAR[phase] || "--test") : TONE_VAR[tone] || "--rule";

// Live activity feed (state/activity.jsonl, one line per step the agent takes in Claude Code).
const ACTIVE = new Set(["planning", "implementing", "checking", "reviewing", "fixing"]);
const QUIET_MIN = 5;   // a running task with no step for this long has "gone quiet"
const RECENT = 8;      // steps in the short history under the current one
const KIND_ICON = {
  read: `<path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/>`,
  edit: `<path d="M10.5 2.5l3 3L6 13H3v-3z"/><path d="M9 4l3 3"/>`,
  search: `<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>`,
  test: `<path d="M6 1.5h4M6.5 1.5v4.5L2.8 12.8A1.2 1.2 0 0 0 3.9 14.5h8.2a1.2 1.2 0 0 0 1.1-1.7L9.5 6V1.5"/><path d="M4.5 10h7"/>`,
  framework: `<rect x="3" y="2" width="10" height="12" rx="1.5"/><path d="M5.5 5.5h5M5.5 8.5h5M5.5 11.5h3"/>`,
  command: `<rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M4.5 6l2 2-2 2M8.5 10.5h3"/>`,
  agent: `<circle cx="6" cy="5.5" r="2.2"/><path d="M2 13.5c.5-2.5 2-3.7 4-3.7s3.5 1.2 4 3.7"/><circle cx="11.5" cy="6" r="1.8"/><path d="M11 9.8c1.6.1 2.6 1.3 3 3.2"/>`,
  web: `<circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c2 2.2 2 10.8 0 13M8 1.5c-2 2.2-2 10.8 0 13"/>`,
  plan: `<path d="M2.5 4l1.2 1.2L6 3M2.5 9l1.2 1.2L6 8M8.5 4.5h5M8.5 9.5h5M8.5 13h5"/>`,
  waiting: `<path d="M2.5 3h11v7.5h-6l-3 3v-3h-2z"/><path d="M8 5v2.6M8 9.2v.1"/>`,
  turn: `<path d="M5.5 3.5v9M10.5 3.5v9"/>`,
  note: `<path d="M4 11V7.5a4 4 0 0 1 8 0V11l1.5 1.5h-11zM6.5 14.5h3"/>`,
  other: `<circle cx="8" cy="8" r="2.5"/>`,
};
// Name-free words for the summary, which must not show file names.
const KIND_WORDS = { read: "Reading the code", edit: "Changing a file", search: "Searching the code", test: "Running tests",
  framework: "Recording its progress", command: "Running a command", agent: "Working with a helper agent",
  web: "Looking something up online", plan: "Planning its next steps", waiting: "Waiting for you in Claude Code",
  turn: "Paused between steps", note: "Got a notification", other: "Working" };
const kindOf = a => (a && KIND_ICON[a.kind]) ? a.kind : "other";
const kindIcon = k => `<svg viewBox="0 0 16 16" aria-hidden="true">${KIND_ICON[k] || KIND_ICON.other}</svg>`;
const tsOf = a => { const t = Date.parse(a && a.ts); return isNaN(t) ? null : t; };
// A "waiting" step needs the human when Claude Code asks for permission, or when it asks for a reply
// in the middle of a task. After a finished task, Claude Code simply sits idle: nothing needs the human.
const waitingNeedsYou = (a, phase) => !!a && a.kind === "waiting" && (/permission/i.test(String(a.text || "")) || !["done", "idle"].includes(phase));
// Stuck stays red: a waiting step adds to that, it does not replace it.
const toneOf = p => { const t = phaseOf(p.phase).tone; return t !== "bad" && waitingNeedsYou(p.activity, p.phase) ? "ask" : t; };
function quietFor(a, phase) {
  // Minutes without a step while a task runs; null when that is not worth saying.
  const t = tsOf(a);
  if (!ACTIVE.has(phase) || t === null || (a && a.kind === "waiting")) return null;
  const m = Math.floor((Date.now() - t) / 60000);
  return m >= QUIET_MIN ? m : null;
}
const minutes = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ""}`;
function stepWords(a, phase) {
  if (a.kind === "waiting" && !waitingNeedsYou(a, phase)) return "Idle in Claude Code, ready for a new task";
  const text = String(a.text ?? "");
  return (a.kind === "waiting" ? text : plain(text)) || KIND_WORDS[kindOf(a)];
}
function whoBadge(a) {
  if (!a.subagent) return "";
  const rev = a.subagent === "reviewer";
  return `<span class="who${rev ? " rev" : ""}">${rev ? ICON.shield : ""}${rev ? "Reviewer" : esc(String(a.subagent).replace(/[-_]/g, " "))}</span>`;
}

const WS = "*";  // the workspace view: not a project name (those start with a letter or digit)
let current = null, lastProjects = "", lastDetail = "", railFirst = true;
try { current = new URLSearchParams(location.hash.slice(1)).get("p") || localStorage.getItem("aaf.project"); } catch (e) {}
// Dark is the default (design/DESIGN.md); light is a choice the switch remembers.
let theme = "dark";
try { if (localStorage.getItem("aaf.theme") === "light") theme = "light"; } catch (e) {}
document.documentElement.dataset.theme = theme;

$("#theme").addEventListener("click", () => {
  theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("aaf.theme", theme); } catch (e) {}
  if (current && current !== WS) renderMapSlot();
});

function ago(iso) {
  if (!iso) return "";
  const t = typeof iso === "number" ? iso * 1000 : Date.parse(iso);
  if (isNaN(t)) return "";
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 45) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}
function clock(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const today = new Date().toDateString() === d.toDateString();
  return today ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
               : d.toLocaleDateString([], { day: "numeric", month: "short" });
}

function markdown(src) {
  src = src.replace(/<!--[\s\S]*?-->/g, "");
  const lines = src.split("\n"); let html = "", list = null, inCode = false, para = [];
  const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const flush = () => { if (para.length) { html += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  const openList = kind => { if (list !== kind) { closeList(); html += `<${kind}>`; list = kind; } };
  for (const line of lines) {
    if (line.startsWith("```")) { flush(); closeList(); html += inCode ? "</pre>" : "<pre>"; inCode = !inCode; continue; }
    if (inCode) { html += esc(line) + "\n"; continue; }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    const li = line.match(/^\s*[-*]\s+(\[( |x)\]\s+)?(.*)/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (h) { flush(); closeList(); html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; }
    else if (li) {
      flush(); openList("ul");
      html += li[1] ? `<li class="task-item">${li[2] === "x" ? "☑" : "☐"} ${inline(li[3])}</li>` : `<li>${inline(li[3])}</li>`;
    }
    else if (ol) { flush(); openList("ol"); html += `<li>${inline(ol[1])}</li>`; }
    else if (!line.trim()) { flush(); closeList(); }
    else para.push(line.trim());
  }
  flush(); closeList(); if (inCode) html += "</pre>";
  return html;
}

// Small icons, drawn inline so they work offline.
const ICON = {
  ok: `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor" opacity=".18"/><path d="M5.5 10.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  ask: `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor"/><path d="M10 5.5v5.5" stroke="var(--panel)" stroke-width="2.2" stroke-linecap="round"/><circle cx="10" cy="14.4" r="1.3" fill="var(--panel)"/></svg>`,
  pass: `<svg class="mk" viewBox="0 0 16 16" role="img" aria-label="passed"><circle cx="8" cy="8" r="8" fill="var(--pass)"/><path d="M4.5 8.3l2.3 2.3 4.7-5" fill="none" stroke="var(--panel)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  fail: `<svg class="mk" viewBox="0 0 16 16" role="img" aria-label="failed"><circle cx="8" cy="8" r="8" fill="var(--fail)"/><path d="M5.2 5.2l5.6 5.6M10.8 5.2l-5.6 5.6" stroke="var(--panel)" stroke-width="2" stroke-linecap="round"/></svg>`,
  shield: `<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 1l6 2.5v4c0 3.6-2.6 6.4-6 7.5-3.4-1.1-6-3.9-6-7.5v-4z" fill="currentColor" opacity=".25"/><path d="M5 8l2 2 4-4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

// The agent's loop as a row of steps; the current one pulses.
function loopPicture(st, maxIt) {
  const phase = st.phase || "idle";
  const at = { planning: 0, implementing: 1, fixing: 1, checking: 2, reviewing: 3 }[phase];
  const ends = { done: ["Finished", "end-ok", "tests pass, review approved"], waiting: ["Your call", "end-ask", "waiting for your decision"],
                 stuck: ["Stuck", "end-bad", "needs your help"] };
  const end = ends[phase];
  const steps = [["Plan", "decide the approach"], ["Change", "edit the code"], ["Test", "run every test"],
                 ["Review", "second agent checks"], [end ? end[0] : "Finish", end ? end[2] : "done or ask you"]];
  const reached = phase === "done" ? 5 : phase === "waiting" ? 4 : at === undefined ? -1 : at;
  const items = steps.map(([name, hint], i) => {
    // Stuck: it went round the loop, but none of it led to a pass, so earlier steps are grey, not green.
    let cls = phase === "stuck" && st.iteration ? (i < 4 ? "tried" : "") : i < reached ? "past" : i === reached ? "now" : "";
    if (i === 4 && end) cls = "now " + end[1];
    return `<li class="${cls}"${cls.includes("now") ? ' aria-current="step"' : ""}><span class="node"></span>${esc(name)}<span class="hint">${esc(hint)}</span></li>`;
  }).join("");
  return `<div data-viz="loop" role="img" aria-label="Where the agent is in its work: ${esc(phaseOf(phase).short)}">
    <ol class="steps">${items}</ol>
    <p class="loop-cap" aria-hidden="true">${phase === "idle" ? "It repeats these steps until the tests and the review pass" : "It goes round again if a test or the review fails"}</p></div>`;
}

function donut(pass, total) {
  const r = 30, c = 2 * Math.PI * r, f = total ? pass / total : 0;
  return `<svg class="donut" viewBox="0 0 76 76" data-viz="checks" role="img" aria-label="${pass} of ${total} tests pass">
    <circle cx="38" cy="38" r="${r}" fill="none" stroke="${total ? "var(--fail)" : "var(--grid)"}" stroke-width="10"/>
    <circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--pass)" stroke-width="10" stroke-dasharray="${(f * c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 38 38)"/></svg>`;
}

function reviewBadge(kind) {
  const col = kind === "pass" ? "var(--pass)" : kind === "fail" ? "var(--fail)" : "var(--grid)";
  const mark = kind === "pass" ? `<path d="M20 33l8 8 16-18" fill="none" stroke="var(--panel)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`
    : kind === "fail" ? `<path d="M23 23l18 18M41 23l-18 18" stroke="var(--panel)" stroke-width="5" stroke-linecap="round"/>`
    : `<circle cx="22" cy="32" r="3.5" fill="var(--muted)"/><circle cx="32" cy="32" r="3.5" fill="var(--muted)"/><circle cx="42" cy="32" r="3.5" fill="var(--muted)"/>`;
  return `<svg class="badge" viewBox="0 0 64 64" data-viz="review" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="${col}"/>${mark}</svg>`;
}

// Workspace headline numbers. "First try" comes from every project's task history (/api/record).
let fleetRecord = null, lastList = [];
async function loadFleet() {
  try {
    const res = await fetch("/api/record");
    if (!res.ok) return;
    fleetFrom(await res.json());
  } catch (e) {}
}
function fleetFrom(w) {
  const ps = (w && w.projects) || [];
  const sum = k => ps.reduce((n, p) => n + ((p.summary || {})[k] || 0), 0);
  const next = w && w.available !== false ? { first: sum("first_try"), ended: sum("finished") } : null;
  if (JSON.stringify(next) === JSON.stringify(fleetRecord)) return;
  fleetRecord = next;
  if (lastList.length) renderOverview(lastList);
}

function renderOverview(list) {
  const groups = { bad: 0, ask: 0, busy: 0, ok: 0, idle: 0 };
  list.forEach(p => groups[toneOf(p)]++);
  const need = groups.bad + groups.ask;
  const ft = fleetRecord && fleetRecord.ended ? `${pct(fleetRecord.first, fleetRecord.ended)}%` : "–";
  const ftWords = fleetRecord && fleetRecord.ended ? `${fleetRecord.first} of ${fleetRecord.ended} tasks that ended were right the first time` : "no task has ended yet";
  $("#rail-sub").textContent = `${plural(list.length, "project")} in this workspace`;
  $("#overview").innerHTML = `<div class="fleet" data-fleet data-overview-needs="${need}" role="group"
      aria-label="${need} need you, ${groups.busy} working, ${groups.ok} finished, ${groups.idle} not started; first try: ${esc(ftWords)}">
      <div class="f-need${need ? "" : " calm"}" data-fleet-num="need"><b>${need}</b><span>need you</span></div>
      <div class="f-work" data-fleet-num="working"><b>${groups.busy}</b><span>working</span></div>
      <div class="f-done" data-fleet-num="finished"><b>${groups.ok}</b><span>finished</span></div>
      <div class="f-first" data-fleet-num="first-try" title="${esc(ftWords)}"><b>${ft}</b><span>first try</span></div></div>
    ${groups.idle ? `<p class="fleet-words">${groups.idle} not started</p>` : ""}`;
}

// A tiny picture per project: progress while it works, otherwise its recent test runs.
const LOOP_POS = { planning: 1, implementing: 2, checking: 3, reviewing: 4, fixing: 4.5 };
function mini(p, tone) {
  const col = `var(${toneVar(p.phase, tone)})`;
  if (tone === "busy") {
    const plan = p.plan && p.plan.total ? p.plan : null;
    const f = plan ? plan.done / plan.total : (LOOP_POS[p.phase] || 0) / 5;
    const words = plan ? `step ${Math.min(plan.done + 1, plan.total)} of ${plan.total} of its plan` : `${phaseOf(p.phase).short.toLowerCase()}, stage ${Math.ceil(LOOP_POS[p.phase] || 1)} of 5 of its loop`;
    return `<svg class="mini" data-mini viewBox="0 0 64 22" role="img" aria-label="Working: ${esc(words)}">
      <rect x="0" y="9" width="64" height="5" rx="2.5" fill="var(--grid)"/><rect x="0" y="9" width="${Math.max(4, 64 * f).toFixed(1)}" height="5" rx="2.5" fill="${col}"/></svg>`;
  }
  const t = (p.trend || []).filter(v => typeof v === "number");
  if (!t.length)
    return `<svg class="mini" data-mini viewBox="0 0 64 22" role="img" aria-label="No test runs yet"><line x1="0" y1="11" x2="64" y2="11" stroke="var(--rule)" stroke-width="1.5" stroke-dasharray="3 3"/></svg>`;
  const pts = (t.length === 1 ? [t[0], t[0]] : t).map((v, i, a) => `${(64 * i / (a.length - 1)).toFixed(1)},${(19 - 16 * v).toFixed(1)}`).join(" ");
  return `<svg class="mini" data-mini viewBox="0 0 64 22" role="img" aria-label="Share of tests passing in the last ${plural(t.length, "test run")}, oldest first">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function renderRail(list) {
  lastList = list;
  renderOverview(list);
  const el = $("#projects");
  const keepScroll = el.scrollLeft;
  if (!list.length) { el.innerHTML = `<p class="empty" style="margin:0 8px">No projects yet.</p>`; return; }
  const order = { ask: 0, bad: 0, busy: 1, ok: 2, idle: 3 };
  const labels = ["Needs you", "Working", "Finished", "Not started"];
  const sorted = list.slice().sort((a, b) => order[toneOf(a)] - order[toneOf(b)] || a.name.localeCompare(b.name));
  let html = `<button class="proj ws" type="button" data-p="${WS}" data-workspace aria-current="${current === WS}">
      <span class="dot ws"></span><span class="name">All projects</span><span class="meta">Track record across projects</span></button>`, last = -1;
  for (const p of sorted) {
    const ph = phaseOf(p.phase), tone = toneOf(p), g = order[tone], asks = tone !== ph.tone;
    if (g !== last) { html += `<div class="group-label">${labels[g]}</div>`; last = g; }
    const plan = tone === "busy" && p.plan && p.plan.total ? ` · step ${Math.min(p.plan.done + 1, p.plan.total)} of ${p.plan.total}` : "";
    const extra = asks || ph.tone === "bad" ? "" : plan || (p.drafts ? ` · ${plural(p.drafts, "fix", "fixes")}` : p.checks_total ? ` · ${p.checks_pass}/${p.checks_total} tests pass` : "");
    html += `<button class="proj" type="button" data-p="${esc(p.name)}" aria-current="${p.name === current}">
      <span class="dot ${tone}"></span><span class="name">${esc(p.name)}</span>${mini(p, tone)}
      <span class="meta">${asks ? "Waiting for you in Claude Code" : esc(ph.short)}${esc(extra)}</span></button>`;
  }
  el.innerHTML = html;
  el.querySelectorAll(".proj").forEach(b => b.addEventListener("click", () => select(b.dataset.p)));
  // On phones the list scrolls sideways. A refresh keeps where the user swiped to; only on first
  // render or after picking a project is the open one brought into view, and only if it is hidden.
  el.scrollLeft = keepScroll;
  const cur = el.querySelector('.proj[aria-current="true"]');
  if (cur && el.scrollWidth > el.clientWidth && (railFirst || el.dataset.shown !== current)) {
    railFirst = false; el.dataset.shown = current;
    const right = cur.offsetLeft - el.offsetLeft + cur.offsetWidth;
    if (right > el.clientWidth) el.scrollLeft = right - el.clientWidth * 0.8;
  }
}

function copyRow(cmd) {
