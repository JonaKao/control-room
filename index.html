<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --paper: #E8EDF1;
  --panel: #F6F8FA;
  --ink: #13233A;
  --muted: #5B6A7F;
  --rule: #CCD5DE;
  --track: #DCE3EA;
  --pass: #1D8A6B;
  --fail: #C2412F;
  --active: #C7870F;
  --accent: #2E5A88;
  --code-bg: #EDF1F5;
  --ph-plan: #8C99AB; --ph-change: #3A6EA5; --ph-test: #C7870F; --ph-review: #7B5CB0; --ph-fix: #B5577F;
  --sans: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F161E; --panel: #16202B; --ink: #E2E9F1; --muted: #8B99AC; --rule: #283544;
    --track: #223040; --pass: #3BB48D; --fail: #E2634F; --active: #E3A83A; --accent: #79A5D6; --code-bg: #111A23;
    --ph-plan: #6E7D91; --ph-change: #6D9DD4; --ph-test: #E3A83A; --ph-review: #A98BDB; --ph-fix: #DB86AB;
  }
}
:root[data-theme="dark"] {
  --paper: #0F161E; --panel: #16202B; --ink: #E2E9F1; --muted: #8B99AC; --rule: #283544;
  --track: #223040; --pass: #3BB48D; --fail: #E2634F; --active: #E3A83A; --accent: #79A5D6; --code-bg: #111A23;
    --ph-plan: #6E7D91; --ph-change: #6D9DD4; --ph-test: #E3A83A; --ph-review: #A98BDB; --ph-fix: #DB86AB;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--sans);
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code { font: 12.5px var(--mono); background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }

.app { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }

/* Project rail */
.rail { border-right: 1px solid var(--rule); padding: 24px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.rail-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 0 8px 4px; }
.rail h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.rail .sub { font-size: 13px; color: var(--muted); margin: 0 8px 16px; }
#theme { background: none; border: 1px solid var(--rule); border-radius: 6px; padding: 2px 8px; cursor: pointer; font-size: 12px; color: var(--muted); }
.overview { margin: 0 8px 18px; }
.overview .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--track); gap: 2px; }
.overview .bar span { display: block; height: 100%; }
.overview .words { font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.overview .words strong { color: var(--ink); }
.proj {
  display: grid; grid-template-columns: 12px 1fr; gap: 2px 10px; align-items: center;
  width: 100%; text-align: left; background: none; border: 0; padding: 9px 8px; border-radius: 8px; cursor: pointer;
}
.proj:hover { background: var(--panel); }
.proj[aria-current="true"] { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
.proj .name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj .meta { grid-column: 2; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--rule); flex: none; }
.dot.busy { background: var(--active); }
.dot.ask { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }
.dot.ok { background: var(--pass); }
.dot.bad { background: var(--fail); box-shadow: 0 0 0 3px color-mix(in srgb, var(--fail) 25%, transparent); }
.group-label { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 14px 8px 4px; }

/* Main */
main { padding: 28px 40px 64px; max-width: 1180px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 20px 22px; min-width: 0; }
.sec { margin-bottom: 20px; }
.sec-title { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 28px 2px 10px; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }

/* 1. At a glance */
.glance { padding: 22px 24px 20px; border-left: 6px solid var(--rule); }
.glance.t-ok { border-left-color: var(--pass); }
.glance.t-busy { border-left-color: var(--active); }
.glance.t-ask { border-left-color: var(--accent); }
.glance.t-bad { border-left-color: var(--fail); }
.eyebrow { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.eyebrow .pname { font-weight: 600; color: var(--ink); }
.needs { display: inline-flex; align-items: center; gap: 10px; margin: 14px 0 10px; padding: 7px 14px 7px 10px; border-radius: 999px; font-weight: 600; font-size: 14.5px; }
.needs svg { width: 20px; height: 20px; flex: none; }
.needs[data-needs="no"] { background: color-mix(in srgb, var(--pass) 13%, transparent); color: var(--pass); }
.needs.t-ask { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.needs.t-bad { background: color-mix(in srgb, var(--fail) 14%, transparent); color: var(--fail); }
.doing { font-size: 28px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; }
.task-line { margin: 0; font-size: 15.5px; }
.task-line .lbl { color: var(--muted); }
.agent-note { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

/* Loop picture */
.steps { list-style: none; margin: 22px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); position: relative; }
.steps li { position: relative; text-align: center; font-size: 13px; color: var(--muted); padding-top: 30px; }
.steps li::before { /* connector to the previous step */
  content: ""; position: absolute; top: 10px; right: 50%; width: 100%; height: 3px; background: var(--track); }
.steps li:first-child::before { display: none; }
.steps li.past::before, .steps li.now::before { background: color-mix(in srgb, var(--pass) 55%, var(--track)); }
.steps .node { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 23px; height: 23px; border-radius: 50%;
  background: var(--panel); border: 3px solid var(--track); z-index: 1; }
.steps li.past .node { background: color-mix(in srgb, var(--pass) 55%, var(--panel)); border-color: color-mix(in srgb, var(--pass) 55%, var(--panel)); }
.steps li.now .node { background: var(--active); border-color: var(--active); box-shadow: 0 0 0 5px color-mix(in srgb, var(--active) 22%, transparent); animation: pulse 1.8s ease-in-out infinite; }
.steps li.now { color: var(--ink); font-weight: 600; }
.steps li.tried::before { background: color-mix(in srgb, var(--muted) 40%, var(--track)); }
.steps li.tried .node { background: color-mix(in srgb, var(--muted) 45%, var(--panel)); border-color: color-mix(in srgb, var(--muted) 45%, var(--panel)); }
.steps li.end-ok .node { background: var(--pass); border-color: var(--pass); animation: none; box-shadow: none; }
.steps li.end-ask .node { background: var(--accent); border-color: var(--accent); animation: none; box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 22%, transparent); }
.steps li.end-bad::before { background: var(--track); }
.steps li.end-bad .node { background: var(--fail); border-color: var(--fail); animation: none; box-shadow: 0 0 0 5px color-mix(in srgb, var(--fail) 22%, transparent); }
.steps .hint { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
@keyframes pulse { 50% { box-shadow: 0 0 0 9px color-mix(in srgb, var(--active) 8%, transparent); } }
@media (prefers-reduced-motion: reduce) { .steps li.now .node { animation: none; } }
.loopback { position: relative; margin: 6px 10% 0 30%; height: 22px; border: 2px dashed var(--rule); border-top: 0; border-radius: 0 0 12px 12px; width: 40%; }
.loopback span { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); background: var(--panel); padding: 0 8px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.loopback::after { content: ""; position: absolute; left: -6px; top: -4px; border: 5px solid transparent; border-bottom: 7px solid var(--rule); border-top: 0; }

/* 2. What to do */
.action { border: 1.5px solid var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.action.t-bad { border-color: var(--fail); background: color-mix(in srgb, var(--fail) 5%, var(--panel)); }
.action h3 { margin: 0 0 4px; font-size: 18px; }
.action .lead { margin: 0 0 14px; color: var(--muted); }
.draft { border-top: 1px solid var(--rule); padding: 14px 0 6px; }
.draft:first-of-type { border-top: 0; padding-top: 4px; }
.draft .issue { font-weight: 700; font-size: 16px; }
.draft p { margin: 2px 0 6px; }
.safe { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--pass); font-weight: 600; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 12px 0 6px; }
.choice { border: 1px solid var(--rule); background: var(--panel); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.choice b { display: block; }
.choice .why { font-size: 13.5px; color: var(--muted); margin: 2px 0 8px; }
.copy-row { display: flex; gap: 8px; align-items: center; }
.copy-row code { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.copy-row button { border: 0; border-radius: 6px; padding: 5px 12px; font-size: 13px; font-weight: 600; cursor: pointer; background: var(--accent); color: var(--panel); flex: none; }
.how { font-size: 13px; color: var(--muted); margin: 8px 0 0; }

/* 3. Health tiles */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.tile h4 { margin: 0 0 12px; font-size: 14px; font-weight: 700; }
.tile .big { font-size: 15px; font-weight: 600; margin: 0; }
.tile .small { font-size: 13.5px; color: var(--muted); margin: 4px 0 0; }
.tile-row { display: flex; gap: 16px; align-items: center; }
.donut { width: 76px; height: 76px; flex: none; }
.donut text { font: 700 17px var(--sans); fill: var(--ink); }
.tests { list-style: none; margin: 14px 0 0; padding: 0; font-size: 14px; }
.tests li { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
.tests li .mk { width: 16px; height: 16px; flex: none; }
.badge { width: 64px; height: 64px; flex: none; }
.pips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
.pips span { width: 18px; height: 18px; border-radius: 5px; background: var(--track); }
.pips span.used { background: color-mix(in srgb, var(--muted) 55%, var(--track)); }
.pips span.used.last { background: var(--active); }
.pips span.used.last-ok { background: var(--pass); }
.pips span.used.last-bad { background: var(--fail); }
.pips span.used.last-ask { background: var(--accent); }
.tile details { margin-top: 12px; }
summary { cursor: pointer; }
.tile summary, .more summary { color: var(--accent); font-size: 14px; }
pre.out { margin: 8px 0 0; padding: 12px 14px; background: var(--code-bg); border-radius: 8px;
  font: 12.5px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow: auto; }

/* 4. Over time */
.history { display: grid; grid-template-columns: auto 1fr; gap: 0 10px; }
.history .axis { display: flex; flex-direction: column; justify-content: space-between; font-size: 11.5px; color: var(--muted); height: 90px; text-align: right; }
.history .bars { display: flex; gap: 3px; align-items: flex-end; height: 90px; border-bottom: 1px solid var(--rule); border-top: 1px dashed var(--rule); }
.history .bars span { flex: 1 1 0; max-width: 22px; min-height: 4px; border-radius: 3px 3px 0 0; background: var(--pass); }
.history .bars span.f { background: var(--fail); }
.history .cap { grid-column: 2; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.legend { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

/* 4b. Task timeline */
.tt-list { display: grid; gap: 4px; }
.tt-row { display: grid; grid-template-columns: minmax(0, 1fr) 76px; gap: 2px 12px; align-items: center; padding: 8px 0 4px; min-width: 0; }
.tt-head { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-width: 0; }
.tt-head .tt-name { font-weight: 600; font-size: 14.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.tt-head .tt-when { font-size: 12.5px; color: var(--muted); }
.tt-out { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; padding: 1px 9px 1px 6px; border-radius: 999px; }
.tt-out svg { width: 14px; height: 14px; }
.tt-out.o-done { color: var(--pass); background: color-mix(in srgb, var(--pass) 12%, transparent); }
.tt-out.o-waiting { color: var(--accent); background: color-mix(in srgb, var(--accent) 13%, transparent); }
.tt-out.o-stuck { color: var(--fail); background: color-mix(in srgb, var(--fail) 12%, transparent); }
.tt-out.o-running { color: var(--active); background: color-mix(in srgb, var(--active) 14%, transparent); }
.tt-track { position: relative; display: flex; align-items: center; height: 40px; padding-top: 14px; min-width: 0; }
.tt-bar { display: flex; height: 22px; flex: none; }
.tt-seg { flex: var(--d) 1 0; min-width: 2px; height: 100%; border: 0; padding: 0; margin: 0; cursor: pointer; position: relative;
  background: var(--c); box-shadow: inset -1px 0 0 var(--panel); }
.tt-seg:first-child { border-radius: 5px 0 0 5px; }
.tt-seg:last-child { border-radius: 0 5px 5px 0; box-shadow: none; }
.tt-seg:only-child { border-radius: 5px; }
.tt-seg:hover { filter: brightness(1.08); }
.tt-seg[aria-pressed="true"] { outline: 2.5px solid var(--ink); outline-offset: 1px; z-index: 2; }
.tt-seg.att::before { content: ""; position: absolute; left: -1px; top: -6px; bottom: -3px; width: 2px; background: var(--ink); border-radius: 1px; }
.tt-seg [data-attempt-mark] { position: absolute; left: -4px; top: -19px; font-size: 10.5px; line-height: 1; font-weight: 600; color: var(--muted); }
.tt-gap { flex: 0 0 14px; height: 22px; border: 0; padding: 0; margin: 0 2px; cursor: pointer; border-radius: 3px;
  background: repeating-linear-gradient(135deg, var(--rule) 0 3px, transparent 3px 6px); }
.tt-gap[aria-pressed="true"] { outline: 2.5px solid var(--ink); outline-offset: 1px; }
.tt-end { flex: none; width: 18px; height: 18px; margin-left: 4px; display: inline-flex; }
.tt-end svg { width: 18px; height: 18px; }
.tt-end.o-done { color: var(--pass); } .tt-end.o-waiting { color: var(--accent); } .tt-end.o-stuck { color: var(--fail); }
.tt-end.o-running span { width: 10px; height: 10px; margin: 4px; border-radius: 50%; background: var(--active);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--active) 22%, transparent); animation: pulse 1.8s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .tt-end.o-running span { animation: none; } }
.tt-total { font-size: 14px; font-weight: 600; text-align: right; padding-top: 14px; white-space: nowrap; }
.tt-detail { grid-column: 1 / -1; margin: 6px 0 4px; padding: 10px 14px; border-radius: 10px; background: var(--paper); border-left: 4px solid var(--c, var(--rule)); font-size: 14px; }
.tt-detail p { margin: 0; }
.tt-detail .tt-dt { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.tt-detail ul { margin: 6px 0 0; padding-left: 18px; }
.tt-axis { position: relative; height: 22px; margin-right: 88px; border-top: 1px solid var(--rule); margin-top: 6px; font-size: 11.5px; color: var(--muted); }
.tt-axis span { position: absolute; top: 3px; transform: translateX(-50%); white-space: nowrap; }
.tt-axis span:first-child { transform: none; }
.tt-axis span::before { content: ""; position: absolute; left: 50%; top: -7px; height: 5px; border-left: 1px solid var(--rule); }
.tt-axis span:first-child::before { left: 0; }
.tt-cap { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; }
.tt-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.tt-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.tt-legend .k-gap i { background: repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 4px); }
.tt-legend .k-att i { width: 2px; background: var(--ink); border-radius: 1px; }
.tt-older summary { color: var(--accent); font-size: 14px; margin-top: 8px; }

/* 5. Plots */
.plots { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.plot { margin: 0; background: var(--paper); border-radius: 10px; overflow: hidden; border: 1px solid var(--rule); }
.plot button { display: block; width: 100%; padding: 0; border: 0; background: #fff; cursor: zoom-in; }
.plot img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; }
.plot figcaption { padding: 8px 12px; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; }
.plot figcaption span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.plot figcaption span:last-child { color: var(--muted); white-space: nowrap; }
dialog { border: 0; padding: 0; border-radius: 12px; max-width: 92vw; max-height: 92vh; background: #fff; }
dialog::backdrop { background: rgba(10, 20, 32, 0.7); }
dialog img { display: block; max-width: 92vw; max-height: 86vh; }
dialog p { margin: 0; padding: 8px 14px; font-size: 13px; color: #13233A; }

/* 6. More detail */
.more { padding: 0; }
.more > details { border-top: 1px solid var(--rule); }
.more > details:first-child { border-top: 0; }
.more > details > summary { list-style: none; display: grid; grid-template-columns: minmax(0, 1fr) auto 14px; gap: 12px; align-items: center; padding: 14px 22px; color: var(--ink); }
.more > details > summary > span:first-child { min-width: 0; }
.more > details > summary::-webkit-details-marker { display: none; }
.more summary .st { font-weight: 600; font-size: 15px; }
.more summary .teaser { display: block; font-weight: 400; font-size: 13.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.more summary .n { font-size: 13px; color: var(--muted); }
.chev { width: 8px; height: 8px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(-45deg); transition: transform .15s; }
details[open] > summary .chev { transform: rotate(45deg); }
.more .body { padding: 0 22px 18px; }

.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: var(--rule); }
.timeline li { position: relative; padding: 0 0 14px 26px; }
.timeline li::before { content: ""; position: absolute; left: 0; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 2px solid var(--accent); }
.timeline .dt { font-size: 12.5px; color: var(--muted); }
.timeline .dtitle { font-weight: 600; }
.timeline .dbody { font-size: 14px; color: var(--muted); margin-top: 2px; }

.md { font-size: 14.5px; max-width: 72ch; }
.md h1 { font-size: 17px; margin: 0 0 8px; }
.md h2 { font-size: 15px; margin: 14px 0 6px; }
.md h3 { font-size: 14px; margin: 12px 0 4px; }
.md p { margin: 0 0 8px; }
.md ul, .md ol { margin: 0 0 8px; padding-left: 20px; }
.md li.task-item { list-style: none; margin-left: -20px; }
.md pre { background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow: auto; font: 12.5px var(--mono); }

.now-line { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
.now-line svg { width: 16px; height: 16px; margin-right: 6px; vertical-align: -3px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.now-line .q { margin-left: 8px; white-space: nowrap; }
.now-line.ask { color: var(--accent); font-weight: 600; }
.now-line .q { color: var(--active); font-weight: 600; display: inline-block; }
.kicon { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; flex: none;
  background: color-mix(in srgb, var(--muted) 14%, transparent); color: var(--muted); }
.kicon svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.kicon.k-edit { background: color-mix(in srgb, var(--active) 16%, transparent); color: var(--active); }
.kicon.k-test { background: color-mix(in srgb, var(--pass) 15%, transparent); color: var(--pass); }
.kicon.k-agent, .kicon.k-waiting { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
.live .current { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 14px; align-items: center; }
.live .current .kicon { width: 44px; height: 44px; border-radius: 12px; }
.live .current .kicon svg { width: 22px; height: 22px; }
.live .current .lbl { font-size: 12.5px; color: var(--muted); }
.live .current .ctext { font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
.live .current[data-attention="yes"] { padding: 14px 16px; border-radius: 12px; border: 2px solid var(--accent);
  background: color-mix(in srgb, var(--accent) 10%, transparent); }
.live .current[data-attention="yes"] .kicon { background: var(--accent); color: var(--panel); }
.live .current[data-attention="yes"] .lbl { color: var(--accent); font-weight: 600; }
.live .cmd { margin-top: 6px; font-size: 13px; }
.live .cmd summary { cursor: pointer; color: var(--muted); }
.live .cmd code { display: inline-block; margin-top: 4px; overflow-wrap: anywhere; white-space: normal; }
.live .quiet { margin: 14px 0 0; padding: 10px 14px; border-radius: 10px; font-size: 14px;
  background: color-mix(in srgb, var(--active) 14%, transparent); }
.step-list { list-style: none; margin: 16px 0 0; padding: 0; }
.step-list li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 6px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.step-list .stext { overflow-wrap: anywhere; }
.step-list .t { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.live details[data-detail="steps"] { margin-top: 8px; }
.live details[data-detail="steps"] > summary { cursor: pointer; color: var(--muted); font-size: 13.5px; padding: 6px 0; }
.who { display: inline-flex; align-items: center; gap: 4px; margin-left: 8px; padding: 0 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
  white-space: nowrap; vertical-align: 1px; color: var(--muted); border: 1px solid var(--rule); }
.who.rev { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.who svg { width: 12px; height: 12px; }
.wait-card h3 { margin: 0 0 6px; }
.action .wait-card + .wait-card, .action .wait-card + h3 { margin-top: 18px; }
.activity { list-style: none; margin: 0; padding: 0; }
.activity li { display: grid; grid-template-columns: 70px 10px minmax(0, 1fr); gap: 12px; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--rule); font-size: 14px; }
.activity li:first-child { border-top: 0; }
.activity .t { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.activity .k { width: 8px; height: 8px; border-radius: 2px; background: var(--muted); transform: translateY(-1px); }
.activity .k.decision { background: var(--ink); }
.activity .k.draft { background: var(--accent); }
.activity .k.bad { background: var(--fail); }
.activity .k.good { background: var(--pass); }
.activity span:last-child { overflow-wrap: anywhere; }


/* Git: saved versions */
.git-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px 24px; align-items: start; }
.sync { display: grid; grid-template-columns: auto minmax(90px, 1fr) auto; align-items: center; gap: 10px; }
.place { border: 1.5px solid var(--rule); border-radius: 10px; padding: 8px 12px; text-align: center; font-size: 13px; font-weight: 600; background: var(--paper); }
.place small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.place.dirty { border-color: var(--active); }
.lanes { display: grid; gap: 6px; font-size: 12.5px; color: var(--muted); text-align: center; }
.lane { position: relative; padding-bottom: 6px; }
.lane::after { content: ""; position: absolute; left: 0; right: 8px; bottom: 0; height: 2px; background: var(--rule); }
.lane::before { content: ""; position: absolute; right: 0; bottom: -4px; border: 5px solid transparent; border-left: 8px solid var(--rule); border-right: 0; }
.lane.back::after { left: 8px; right: 0; }
.lane.back::before { left: 0; right: auto; border-left: 0; border-right: 8px solid var(--rule); }
.lane.on { color: var(--ink); font-weight: 600; }
.lane.on::after { background: var(--accent); }
.lane.on::before { border-left-color: var(--accent); }
.lane.back.on::before { border-right-color: var(--accent); border-left-color: transparent; }
.sync-words { margin: 12px 0 0; font-size: 14.5px; }
.git-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.git-actions button { border: 1px solid var(--accent); background: var(--accent); color: var(--panel); border-radius: 8px; padding: 7px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
.git-actions button.secondary { background: transparent; color: var(--accent); }
.git-actions button:disabled { opacity: .45; cursor: not-allowed; }
.git-why { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; text-align: right; }
.git-link { font-size: 14px; color: var(--accent); }
.git-msg { margin: 12px 0 0; padding: 8px 12px; border-radius: 8px; font-size: 14px; background: color-mix(in srgb, var(--pass) 12%, transparent); }
.git-msg.bad { background: color-mix(in srgb, var(--fail) 12%, transparent); }
.git-files ul { margin: 6px 0 0; padding-left: 20px; font: 12.5px var(--mono); }
.git-files summary { color: var(--accent); font-size: 14px; margin-top: 12px; }
.tl-wrap { overflow-x: auto; margin-top: 18px; padding: 4px 2px 2px; }
.tl { display: inline-flex; align-items: center; gap: 0; position: relative; height: 44px; }
.tl::before { content: ""; position: absolute; left: 12px; right: 12px; top: 50%; height: 2px; background: var(--rule); }
.tl button { position: relative; width: 30px; height: 30px; flex: none; border: 0; background: none; padding: 0; cursor: pointer; display: grid; place-items: center; }
.tl button + button { margin-left: 14px; }
.tl .pt { width: 16px; height: 16px; border-radius: 50%; background: var(--rule); border: 3px solid var(--panel); box-shadow: 0 0 0 1px var(--rule); }
.tl [data-state="ok"] .pt { background: var(--pass); box-shadow: 0 0 0 1px var(--pass); }
.tl [data-state="tested"] .pt { background: var(--active); box-shadow: 0 0 0 1px var(--active); }
.tl [data-state="bad"] .pt { background: var(--fail); box-shadow: 0 0 0 1px var(--fail); }
.tl [data-pushed="no"] .pt { outline: 2px dashed var(--accent); outline-offset: 3px; }
.tl button[aria-pressed="true"] .pt { transform: scale(1.35); }
.tl-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 2px; }
.tl-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.tl-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.commit-detail { margin-top: 14px; border-top: 1px solid var(--rule); padding-top: 12px; }
.commit-detail .subj { font-weight: 700; font-size: 16px; overflow-wrap: anywhere; }
.commit-detail .meta { font-size: 13px; color: var(--muted); margin: 2px 0 8px; }
.commit-detail .facts .mk { width: 16px; height: 16px; vertical-align: -3px; margin-right: 4px; }
.commit-detail .facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; margin-bottom: 8px; }
.commit-detail ul { margin: 4px 0 0; padding-left: 20px; font-size: 14px; }
.commit-detail .why { color: var(--muted); font-size: 13.5px; }
.hint-pick { font-size: 13px; color: var(--muted); margin: 10px 0 0; }
@media (max-width: 860px) {
  .git-top { grid-template-columns: minmax(0, 1fr); }
  .git-actions { justify-content: flex-start; }
  .git-why { text-align: left; }
}

.welcome { max-width: 60ch; padding-top: 10vh; }
.welcome h2 { font-size: 30px; margin: 0 0 12px; }
.welcome ol { padding-left: 20px; }

@media (max-width: 1100px) {
  .tiles { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 14px 16px 12px; }
  .rail .sub, .group-label, .proj .meta { display: none; }
  .overview { margin: 8px 0 10px; }
  .rail-top { margin: 0; }
  /* One row that scrolls on its own, so a long list never pushes the summary down. */
  #projects { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px;
    -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); }
  #projects::-webkit-scrollbar { display: none; }
  .proj { flex: none; width: auto; display: inline-flex; gap: 6px; padding: 5px 10px; border: 1px solid var(--rule); border-radius: 999px; }
  .proj[aria-current="true"] { box-shadow: none; border-color: var(--accent); }
  .proj .name { font-size: 13px; }
  main { padding: 16px 16px 48px; }
  .tiles { grid-template-columns: minmax(0, 1fr); }
  .glance { padding: 16px 16px 16px 14px; }
  .doing { font-size: 22px; }
  .steps li { font-size: 11.5px; }
  .steps .hint { display: none; }
  .loopback { margin-left: 30%; }
  .more > details > summary { padding: 12px 16px; }
  .more .body { padding: 0 16px 14px; }
  .panel { padding: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Projects">
    <div class="rail-top"><h1>Agent Control Room</h1><button id="theme" type="button" aria-label="Switch between light and dark">Theme</button></div>
    <p class="sub">What each project's agent is doing, live</p>
    <div id="overview"></div>
    <div id="projects"></div>
  </nav>
  <main id="main" aria-live="polite"></main>
</div>
<dialog id="lightbox"><img alt=""><p></p></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plural = (n, one, many) => `${n} ${n === 1 ? one : (many || one + "s")}`;

// Every phase in plain words: what it means for someone who doesn't know the code.
const PHASES = {
  idle:         { tone: "idle", short: "Not started",          doing: "Not working on anything right now" },
  planning:     { tone: "busy", short: "Planning",             doing: "Planning how to tackle the task" },
  implementing: { tone: "busy", short: "Making a change",      doing: "Making a change to the code" },
  fixing:       { tone: "busy", short: "Polishing",            doing: "Polishing: fixing small points the reviewer raised" },
  checking:     { tone: "busy", short: "Testing",              doing: "Testing its latest change" },
  reviewing:    { tone: "busy", short: "Being reviewed",       doing: "A second, independent agent is reviewing the work" },
  waiting:      { tone: "ask",  short: "Needs your decision",  doing: "Paused until you decide on an unfinished fix" },
  done:         { tone: "ok",   short: "Finished",             doing: "Finished the task" },
  stuck:        { tone: "bad",  short: "Stuck, needs you",     doing: "Stopped: it could not solve this on its own" },
};
const phaseOf = p => PHASES[p] || PHASES.idle;

// Agent-written text (notes, task, events) reworded: framework terms and file names in plain words.
const FILE_WORDS = [[/\b(?:state\/)?progress\.md\b/g, "the progress note"], [/\b(?:state\/)?decisions\.md\b/g, "the decision log"],
  [/\bDONE\.md\b/g, "the definition of done"], [/\bCLAUDE\.md\b/g, "the project instructions"],
  [/\bproject\.json\b/g, "the project settings"], [/\b(?:state\/)?reviews\/latest\.md\b/g, "the review"],
  [/\b(?:state\/)?checks\.json\b/g, "the test results"], [/\b(?:state\/)?check_history\.jsonl\b/g, "the test history"],
  [/\b(?:state\/)?status\.json\b/g, "the status"], [/\b(?:state\/)?events\.jsonl\b/g, "the activity log"],
  [/\b(?:state\/)?review\.json\b/g, "the review"], [/\b(?:framework\/)?aaf\.py\b/g, "the framework tool"], [/\bvia aaf\b/g, "with the framework tool"]];
function plain(t) {
  let s = String(t ?? "");
  for (const [re, words] of FILE_WORDS) s = s.replace(re, words);
  return s.replace(/\biterations?\b/gi, m => /s$/i.test(m) ? "attempts" : "attempt")
    .replace(/^Implementing\b/, "Making a change").replace(/^Checking\b/, "Testing").replace(/^Reviewing\b/, "Being reviewed")
    .replace(/^Fixing\b/, "Polishing").replace(/^Waiting\b/, "Waiting for you").replace(/^Planning\b/, "Planning")
    .replace(/\bimplementing\b/gi, "making a change")
    .replace(/\b(\d+)\s*\/\s*(\d+) checks?\b/gi, "$1 of $2 tests").replace(/\bchecks\b|\bcheck(?= (?:pass|fail|result|run))/gi, m => (m[0] === "C" ? "T" : "t") + "est" + (m.length > 5 ? "s" : ""))
    .replace(/\bdrafts? (fix-(\d+))\b/gi, "unfinished fix $2").replace(/(^|[^\w-])fix-(\d+)\b/gi, "$1fix $2")
    .replace(/\b(\d+) drafts\b/gi, "$1 unfinished fixes").replace(/\b1 draft\b/gi, "1 unfinished fix").replace(/\bno drafts\b/gi, "no unfinished fixes")
    .replace(/\bminor findings?\b/gi, m => /s$/i.test(m) ? "small review points" : "small review point")
    .replace(/\bphase\b/gi, m => m[0] === "P" ? "Stage" : "stage");
}
const needsYou = p => p === "waiting" || p === "stuck";

// Live activity feed (state/activity.jsonl, one line per step the agent takes in Claude Code).
const ACTIVE = new Set(["planning", "implementing", "checking", "reviewing", "fixing"]);
const QUIET_MIN = 5;   // a running task with no step for this long has "gone quiet"
const RECENT = 8;      // steps in the short history under the current one
const KIND_ICON = {
  read: `<path d="M1.5 8s2.5-4.5 6.5-4.5S14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/>`,
  edit: `<path d="M10.5 2.5l3 3L6 13H3v-3z"/><path d="M9 4l3 3"/>`,
  search: `<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/>`,
  test: `<path d="M6 1.5h4M6.5 1.5v4.5L2.8 12.8A1.2 1.2 0 0 0 3.9 14.5h8.2a1.2 1.2 0 0 0 1.1-1.7L9.5 6V1.5"/><path d="M4.5 10h7"/>`,
  framework: `<rect x="3" y="2" width="10" height="12" rx="1.5"/><path d="M5.5 5.5h5M5.5 8.5h5M5.5 11.5h3"/>`,
  command: `<rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><path d="M4.5 6l2 2-2 2M8.5 10.5h3"/>`,
  agent: `<circle cx="6" cy="5.5" r="2.2"/><path d="M2 13.5c.5-2.5 2-3.7 4-3.7s3.5 1.2 4 3.7"/><circle cx="11.5" cy="6" r="1.8"/><path d="M11 9.8c1.6.1 2.6 1.3 3 3.2"/>`,
  web: `<circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c2 2.2 2 10.8 0 13M8 1.5c-2 2.2-2 10.8 0 13"/>`,
  plan: `<path d="M2.5 4l1.2 1.2L6 3M2.5 9l1.2 1.2L6 8M8.5 4.5h5M8.5 9.5h5M8.5 13h5"/>`,
  waiting: `<path d="M2.5 3h11v7.5h-6l-3 3v-3h-2z"/><path d="M8 5v2.6M8 9.2v.1"/>`,
  turn: `<path d="M5.5 3.5v9M10.5 3.5v9"/>`,
  note: `<path d="M4 11V7.5a4 4 0 0 1 8 0V11l1.5 1.5h-11zM6.5 14.5h3"/>`,
  other: `<circle cx="8" cy="8" r="2.5"/>`,
};
// Name-free words for the summary, which must not show file names.
const KIND_WORDS = { read: "Reading the code", edit: "Changing a file", search: "Searching the code", test: "Running tests",
  framework: "Recording its progress", command: "Running a command", agent: "Working with a helper agent",
  web: "Looking something up online", plan: "Planning its next steps", waiting: "Waiting for you in Claude Code",
  turn: "Paused between steps", note: "Got a notification", other: "Working" };
const kindOf = a => (a && KIND_ICON[a.kind]) ? a.kind : "other";
const kindIcon = k => `<svg viewBox="0 0 16 16" aria-hidden="true">${KIND_ICON[k] || KIND_ICON.other}</svg>`;
const tsOf = a => { const t = Date.parse(a && a.ts); return isNaN(t) ? null : t; };
// A "waiting" step needs the human when Claude Code asks for permission, or when it asks for a reply
// in the middle of a task. After a finished task, Claude Code simply sits idle: nothing needs the human.
const waitingNeedsYou = (a, phase) => !!a && a.kind === "waiting" && (/permission/i.test(String(a.text || "")) || !["done", "idle"].includes(phase));
// Stuck stays red: a waiting step adds to that, it does not replace it.
const toneOf = p => { const t = phaseOf(p.phase).tone; return t !== "bad" && waitingNeedsYou(p.activity, p.phase) ? "ask" : t; };
function quietFor(a, phase) {
  // Minutes without a step while a task runs; null when that is not worth saying.
  const t = tsOf(a);
  if (!ACTIVE.has(phase) || t === null || (a && a.kind === "waiting")) return null;
  const m = Math.floor((Date.now() - t) / 60000);
  return m >= QUIET_MIN ? m : null;
}
const minutes = m => m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ""}`;
function stepWords(a, phase) {
  if (a.kind === "waiting" && !waitingNeedsYou(a, phase)) return "Idle in Claude Code, ready for a new task";
  const text = String(a.text ?? "");
  return (a.kind === "waiting" ? text : plain(text)) || KIND_WORDS[kindOf(a)];
}
function whoBadge(a) {
  if (!a.subagent) return "";
  const rev = a.subagent === "reviewer";
  return `<span class="who${rev ? " rev" : ""}">${rev ? ICON.shield : ""}${rev ? "Reviewer" : esc(String(a.subagent).replace(/[-_]/g, " "))}</span>`;
}

let current = null, lastProjects = "", lastDetail = "", railFirst = true;
try { current = new URLSearchParams(location.hash.slice(1)).get("p") || localStorage.getItem("aaf.project"); } catch (e) {}
try { const t = localStorage.getItem("aaf.theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

$("#theme").addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("aaf.theme", next); } catch (e) {}
});

function ago(iso) {
  if (!iso) return "";
  const t = typeof iso === "number" ? iso * 1000 : Date.parse(iso);
  if (isNaN(t)) return "";
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 45) return "just now";
  if (s < 3600) return Math.round(s / 60) + " min ago";
  if (s < 86400) return Math.round(s / 3600) + " h ago";
  return Math.round(s / 86400) + " d ago";
}
function clock(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const today = new Date().toDateString() === d.toDateString();
  return today ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
               : d.toLocaleDateString([], { day: "numeric", month: "short" });
}

function markdown(src) {
  src = src.replace(/<!--[\s\S]*?-->/g, "");
  const lines = src.split("\n"); let html = "", list = null, inCode = false, para = [];
  const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const flush = () => { if (para.length) { html += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  const openList = kind => { if (list !== kind) { closeList(); html += `<${kind}>`; list = kind; } };
  for (const line of lines) {
    if (line.startsWith("```")) { flush(); closeList(); html += inCode ? "</pre>" : "<pre>"; inCode = !inCode; continue; }
    if (inCode) { html += esc(line) + "\n"; continue; }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    const li = line.match(/^\s*[-*]\s+(\[( |x)\]\s+)?(.*)/);
    const ol = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (h) { flush(); closeList(); html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; }
    else if (li) {
      flush(); openList("ul");
      html += li[1] ? `<li class="task-item">${li[2] === "x" ? "☑" : "☐"} ${inline(li[3])}</li>` : `<li>${inline(li[3])}</li>`;
    }
    else if (ol) { flush(); openList("ol"); html += `<li>${inline(ol[1])}</li>`; }
    else if (!line.trim()) { flush(); closeList(); }
    else para.push(line.trim());
  }
  flush(); closeList(); if (inCode) html += "</pre>";
  return html;
}

// Small icons, drawn inline so they work offline.
const ICON = {
  ok: `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor" opacity=".18"/><path d="M5.5 10.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  ask: `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor"/><path d="M10 5.5v5.5" stroke="var(--panel)" stroke-width="2.2" stroke-linecap="round"/><circle cx="10" cy="14.4" r="1.3" fill="var(--panel)"/></svg>`,
  pass: `<svg class="mk" viewBox="0 0 16 16" role="img" aria-label="passed"><circle cx="8" cy="8" r="8" fill="var(--pass)"/><path d="M4.5 8.3l2.3 2.3 4.7-5" fill="none" stroke="var(--panel)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  fail: `<svg class="mk" viewBox="0 0 16 16" role="img" aria-label="failed"><circle cx="8" cy="8" r="8" fill="var(--fail)"/><path d="M5.2 5.2l5.6 5.6M10.8 5.2l-5.6 5.6" stroke="var(--panel)" stroke-width="2" stroke-linecap="round"/></svg>`,
  shield: `<svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M8 1l6 2.5v4c0 3.6-2.6 6.4-6 7.5-3.4-1.1-6-3.9-6-7.5v-4z" fill="currentColor" opacity=".25"/><path d="M5 8l2 2 4-4.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
};

// The agent's loop as a row of steps; the current one pulses.
function loopPicture(st, maxIt) {
  const phase = st.phase || "idle";
  const at = { planning: 0, implementing: 1, fixing: 1, checking: 2, reviewing: 3 }[phase];
  const ends = { done: ["Finished", "end-ok", "tests pass, review approved"], waiting: ["Your call", "end-ask", "waiting for your decision"],
                 stuck: ["Stuck", "end-bad", "needs your help"] };
  const end = ends[phase];
  const steps = [["Plan", "decide the approach"], ["Change", "edit the code"], ["Test", "run every test"],
                 ["Review", "second agent checks"], [end ? end[0] : "Finish", end ? end[2] : "done or ask you"]];
  const reached = phase === "done" ? 5 : phase === "waiting" ? 4 : at === undefined ? -1 : at;
  const items = steps.map(([name, hint], i) => {
    // Stuck: it went round the loop, but none of it led to a pass, so earlier steps are grey, not green.
    let cls = phase === "stuck" && st.iteration ? (i < 4 ? "tried" : "") : i < reached ? "past" : i === reached ? "now" : "";
    if (i === 4 && end) cls = "now " + end[1];
    return `<li class="${cls}"${cls.includes("now") ? ' aria-current="step"' : ""}><span class="node"></span>${esc(name)}<span class="hint">${esc(hint)}</span></li>`;
  }).join("");
  const it = st.iteration || 0;
  const attempt = it ? `attempt ${it}${maxIt ? " of up to " + maxIt : ""}` : "repeats until tests and review pass";
  return `<div data-viz="loop" role="img" aria-label="Where the agent is in its work: ${esc(phaseOf(phase).short)}">
    <ol class="steps">${items}</ol>
    <div class="loopback" aria-hidden="true"><span>${phase === "idle" ? "repeats until tests and review pass" : "loops back if a test or the review fails · " + esc(attempt)}</span></div></div>`;
}

function donut(pass, total) {
  const r = 30, c = 2 * Math.PI * r, f = total ? pass / total : 0;
  return `<svg class="donut" viewBox="0 0 76 76" data-viz="checks" role="img" aria-label="${pass} of ${total} tests pass">
    <circle cx="38" cy="38" r="${r}" fill="none" stroke="${total ? "var(--fail)" : "var(--track)"}" stroke-width="10"/>
    <circle cx="38" cy="38" r="${r}" fill="none" stroke="var(--pass)" stroke-width="10" stroke-dasharray="${(f * c).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 38 38)"/>
    <text x="38" y="44" text-anchor="middle">${pass}/${total}</text></svg>`;
}

function reviewBadge(kind) {
  const col = kind === "pass" ? "var(--pass)" : kind === "fail" ? "var(--fail)" : "var(--track)";
  const mark = kind === "pass" ? `<path d="M20 33l8 8 16-18" fill="none" stroke="var(--panel)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`
    : kind === "fail" ? `<path d="M23 23l18 18M41 23l-18 18" stroke="var(--panel)" stroke-width="5" stroke-linecap="round"/>`
    : `<circle cx="22" cy="32" r="3.5" fill="var(--muted)"/><circle cx="32" cy="32" r="3.5" fill="var(--muted)"/><circle cx="42" cy="32" r="3.5" fill="var(--muted)"/>`;
  return `<svg class="badge" viewBox="0 0 64 64" data-viz="review" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="${col}"/>${mark}</svg>`;
}

function renderOverview(list) {
  const groups = { bad: 0, ask: 0, busy: 0, ok: 0, idle: 0 };
  list.forEach(p => groups[toneOf(p)]++);
  const need = groups.bad + groups.ask;
  const seg = (n, col) => n ? `<span style="flex:${n};background:${col}"></span>` : "";
  $("#overview").innerHTML = `<div class="overview" data-overview-needs="${need}">
    <div class="bar" role="img" aria-label="${need} need you, ${groups.busy} working, ${groups.ok} finished, ${groups.idle} not started">
      ${seg(groups.bad, "var(--fail)")}${seg(groups.ask, "var(--accent)")}${seg(groups.busy, "var(--active)")}${seg(groups.ok, "var(--pass)")}${seg(groups.idle, "var(--rule)")}</div>
    <div class="words">${need ? `<strong>${need} need${need === 1 ? "s" : ""} you</strong>` : "Nothing needs you"} · ${groups.busy} working · ${groups.ok} finished${groups.idle ? ` · ${groups.idle} not started` : ""}</div></div>`;
}

function renderRail(list) {
  renderOverview(list);
  const el = $("#projects");
  const keepScroll = el.scrollLeft;
  if (!list.length) { el.innerHTML = `<p class="empty" style="margin:0 8px">No projects yet.</p>`; return; }
  const order = { ask: 0, bad: 0, busy: 1, ok: 2, idle: 3 };
  const labels = ["Needs you", "Working", "Finished", "Not started"];
  const sorted = list.slice().sort((a, b) => order[toneOf(a)] - order[toneOf(b)] || a.name.localeCompare(b.name));
  let html = "", last = -1;
  for (const p of sorted) {
    const ph = phaseOf(p.phase), tone = toneOf(p), g = order[tone], asks = tone !== ph.tone;
    if (g !== last) { html += `<div class="group-label">${labels[g]}</div>`; last = g; }
    const extra = asks || ph.tone === "bad" ? "" : p.drafts ? ` · ${plural(p.drafts, "fix", "fixes")}` : p.checks_total ? ` · ${p.checks_pass}/${p.checks_total} tests pass` : "";
    html += `<button class="proj" type="button" data-p="${esc(p.name)}" aria-current="${p.name === current}">
      <span class="dot ${tone}"></span><span class="name">${esc(p.name)}</span>
      <span class="meta">${asks ? "Waiting for you in Claude Code" : esc(ph.short)}${esc(extra)}</span></button>`;
  }
  el.innerHTML = html;
  el.querySelectorAll(".proj").forEach(b => b.addEventListener("click", () => select(b.dataset.p)));
  // On phones the list scrolls sideways. A refresh keeps where the user swiped to; only on first
  // render or after picking a project is the open one brought into view, and only if it is hidden.
  el.scrollLeft = keepScroll;
  const cur = el.querySelector('.proj[aria-current="true"]');
  if (cur && el.scrollWidth > el.clientWidth && (railFirst || el.dataset.shown !== current)) {
    railFirst = false; el.dataset.shown = current;
    const right = cur.offsetLeft - el.offsetLeft + cur.offsetWidth;
    if (right > el.clientWidth) el.scrollLeft = right - el.clientWidth * 0.8;
  }
}

function welcome() {

    <ol>

function copyRow(cmd) {
