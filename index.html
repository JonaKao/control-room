// ---- Git: saved versions, read through aaf.py on the server; Push/Pull only via the server.
let gitData = null, gitFor = null, gitPick = null, gitMsg = null, gitBusy = null, gitPhase = "idle", gitName = "";
const WORKING = ["planning", "implementing", "checking", "reviewing", "fixing"];

async function loadGit(fresh) {
  const name = current;
  if (!name || name === WS) return;
  try {
    const res = await fetch("/api/git?name=" + encodeURIComponent(name) + (fresh ? "&fresh=1" : ""));
    if (!res.ok || name !== current) return;
    const d = await res.json();
    if (name !== current) return;
    gitData = d; gitFor = name;
  } catch (e) { return; }
  renderGitSlot();
}

// The Review trailer as "pass", "fail" or "" (anything else), whatever its case or spacing.
function reviewOf(t) { const r = (t.Review || "").trim().toLowerCase(); return r === "pass" || r === "fail" ? r : ""; }

function commitState(c) {
  const t = c.trailers || {}, m = /^(\d+)\s*\/\s*(\d+)$/.exec(t.Checks || "");
  const checksOk = m ? m[1] === m[2] : null, review = reviewOf(t);
  if (review === "fail" || checksOk === false) return "bad";
  if (review === "pass") return "ok";
  if (checksOk) return "tested";
  return "none";
}
const STATE_WORDS = { ok: "tests passed, review approved", tested: "tests passed, not reviewed", bad: "a test failed or the review did not approve", none: "no test record (saved by hand)" };

function commitDetail(c, web) {
  const t = c.trailers || {}, m = /^(\d+)\s*\/\s*(\d+)$/.exec(t.Checks || "");
  const review = reviewOf(t);
  const body = c.body || "";
  const dec = (body.split(/\n\n/).find(p => /^Decisions:/.test(p)) || "").split("\n").slice(1);
  const decisions = [];
  dec.forEach(l => { if (/^- /.test(l)) decisions.push({ t: l.slice(2), why: "" }); else if (decisions.length && l.trim()) decisions[decisions.length - 1].why += " " + l.trim(); });
  const rest = body.split(/\n\n/).filter(p => p.trim() && !/^Decisions:/.test(p) && !/^(Checks|Independent review):/.test(p));
  const d = new Date(c.date);
  return `<div class="commit-detail" data-commit-detail>
    <div class="subj">${esc(plain(c.subject))}</div>
    <div class="meta">${isNaN(d) ? "" : esc(d.toLocaleString([], { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }))} · ${esc(c.author)} · version ${esc(c.short)}${web ? ` · <a class="git-link" href="${esc(web)}/commit/${esc(c.hash)}" target="_blank" rel="noopener">see on GitHub ↗</a>` : ""}</div>
    <div class="facts">
      <span>${m ? (m[1] === m[2] ? ICON.pass : ICON.fail) + ` ${m[1]} of ${m[2]} tests passed` : "No test record"}</span>
      ${review ? `<span>${review === "pass" ? ICON.pass : ICON.fail} Review ${review === "pass" ? "approved" : "did not approve"}</span>` : ""}
      ${t["Agent-Attempts"] ? `<span>${esc(plural(+t["Agent-Attempts"], "attempt"))}</span>` : ""}
    </div>
    ${decisions.length ? `<b>Decisions</b><ul>${decisions.map(x => `<li>${esc(plain(x.t))}${x.why ? `<div class="why">${esc(plain(x.why.trim()))}</div>` : ""}</li>`).join("")}</ul>` : ""}
    ${rest.length ? `<p class="why">${esc(plain(rest.join(" ")))}</p>` : ""}
  </div>`;
}

const gitHead = meta => `<div class="ph"><h3>Saved versions (Git)</h3><span class="pm">${esc(meta)}</span></div>`;
function gitHtml() {
  if (!gitData || gitFor !== current) {
    return `<section class="card sec" data-section="git" aria-label="Saved versions">${gitHead("")}<p class="empty">Checking GitHub…</p></section>`;
  }
  const g = gitData;
  if (g.available === false) return "";
  if (!g.repo) {
    return `<section class="card sec" data-section="git" aria-label="Saved versions">${gitHead("")}<p class="empty" data-git-ready>This project is not saved with Git yet, so there is no version history or GitHub copy.${g.error ? " (" + esc(g.error) + ")" : ""}</p></section>`;
  }
  const ahead = g.ahead, behind = g.behind, changed = g.n_changed || 0, remote = !!g.remote;
  const working = WORKING.includes(gitPhase);
  // Sync picture: this computer <-> GitHub.
  const sendTxt = !remote ? "not linked" : ahead == null ? "not sent yet" : ahead ? `${ahead} to send` : "nothing to send";
  const getTxt = !remote ? "" : behind == null ? "" : behind ? `${behind} to get` : "nothing new";
  const words = !remote ? "Only on this computer: there is no GitHub copy linked."
    : ahead == null ? "Linked to GitHub, but nothing has been sent there yet."
    : !ahead && !behind ? `In sync with GitHub${changed ? "" : ", nothing waiting"}.`
    : [ahead ? `${plural(ahead, "saved version")} not on GitHub yet` : "", behind ? `${plural(behind, "newer version")} on GitHub` : ""].filter(Boolean).join(" · ") + ".";
  const sync = `<div data-viz="git-sync" data-ahead="${ahead ?? "?"}" data-behind="${behind ?? "?"}" data-changed="${changed}" role="img" aria-label="${esc(words)}">
      <div class="sync">
        <div class="place${changed ? " dirty" : ""}">This computer<small>${changed ? plural(changed, "unsaved change") : "all saved"}</small></div>
        <div class="lanes"><div class="lane${ahead ? " on" : ""}">${esc(sendTxt)}</div>${remote ? `<div class="lane back${behind ? " on" : ""}">${esc(getTxt)}</div>` : ""}</div>
        <div class="place">GitHub<small>${esc(g.branch || "")}</small></div>
      </div>
      <p class="sync-words">${esc(words)}${changed ? ` ${plural(changed, "file")} changed since the last saved version.` : ""}</p></div>`;
  const pushDis = !remote || ahead === 0 || !!gitBusy, pullDis = !remote || working || behind === 0 || !!gitBusy;
  const why = !remote ? "Push and Pull need a GitHub copy." : working ? "Pull waits while the agent is working on this project." : "";
  const actions = `<div><div class="git-actions">
      <button type="button" data-git-action="push"${pushDis ? " disabled" : ""} title="Send saved versions from this computer to GitHub">${gitBusy === "push" ? "Pushing…" : "Push"}</button>
      <button type="button" class="secondary" data-git-action="pull"${pullDis ? " disabled" : ""} title="Get newer versions from GitHub">${gitBusy === "pull" ? "Pulling…" : "Pull"}</button></div>
      ${why ? `<p class="git-why">${esc(why)}</p>` : ""}
      ${g.web ? `<p class="git-why"><a class="git-link" href="${esc(g.web)}" target="_blank" rel="noopener">Open on GitHub ↗</a></p>` : ""}</div>`;
  const files = changed ? `<details class="git-files" data-detail="git-files" data-keep="git-files"${document.querySelector('details[data-keep="git-files"][open]') ? " open" : ""}>
      <summary>${plural(changed, "file")} changed but not saved yet</summary><ul>${(g.changed || []).map(f => `<li>${esc(f)}</li>`).join("")}${changed > (g.changed || []).length ? `<li>… and ${changed - g.changed.length} more</li>` : ""}</ul></details>` : "";
  const msg = gitMsg ? `<p class="git-msg${gitMsg.ok ? "" : " bad"}" data-git-message role="status">${esc(gitMsg.text)}</p>` : "";
  // Timeline: oldest left, newest right.
  const cs = (g.commits || []).slice().reverse();
  const n = cs.length;
  const pts = cs.map((c, i) => {
    const st = commitState(c), pushed = remote && ahead != null && (n - 1 - i) < ahead ? "no" : "yes";
    return `<button type="button" data-commit="${esc(c.hash)}" data-state="${st}" data-pushed="${pushed}" aria-pressed="${gitPick === c.hash}"
      aria-label="${esc(c.subject)}: ${esc(STATE_WORDS[st])}${pushed === "no" ? ", not on GitHub yet" : ""}" title="${esc(c.subject)}"><span class="pt"></span></button>`;
  }).join("");
  const picked = cs.find(c => c.hash === gitPick);
  const fmt = c => { const d = new Date(c.date); return isNaN(d) ? "" : d.toLocaleDateString([], { day: "numeric", month: "short" }); };
  const timeline = n ? `<div class="tl-wrap"><div class="tl" data-viz="git-timeline" role="group" aria-label="${plural(n, "saved version")}, oldest first">${pts}</div></div>
      <div class="tl-ends"><span>${esc(fmt(cs[0]))} · oldest</span><span>newest · ${esc(fmt(cs[n - 1]))}</span></div>
      <div class="tl-legend"><span><i style="background:var(--pass)"></i>tests passed, review approved</span><span><i style="background:var(--active)"></i>tests passed, not reviewed</span>
        <span><i style="background:var(--fail)"></i>a test or the review failed</span><span><i style="background:var(--rule)"></i>no test record</span>
        <span><i style="background:transparent;outline:2px dashed var(--accent);outline-offset:1px"></i>not on GitHub yet</span></div>
      ${picked ? commitDetail(picked, g.web) : `<p class="hint-pick">Pick a point to see what changed and why.</p>`}`
    : `<p class="empty">No saved versions yet.</p>`;
  return `<section class="card sec" data-section="git" aria-label="Saved versions">${gitHead(n ? plural(n, "saved version") : "")}
      <div class="git-top" data-git-ready>${sync}${actions}</div>${msg}${files}${timeline}</section>`;
}

function renderGitSlot() {
  const slot = $("#git-slot");
  if (!slot) return;
  const sc = $(".tl-wrap", slot), keep = sc ? sc.scrollLeft : null;
  slot.innerHTML = gitHtml();
  const wrap = $(".tl-wrap", slot);
  if (wrap) wrap.scrollLeft = keep ?? wrap.scrollWidth;
  slot.querySelectorAll("[data-commit]").forEach(b => b.addEventListener("click", () => {
    gitPick = gitPick === b.dataset.commit ? null : b.dataset.commit; renderGitSlot();
  }));
  slot.querySelectorAll("[data-git-action]").forEach(b => b.addEventListener("click", () => gitDo(b.dataset.gitAction)));
}

async function gitDo(action) {
  const name = current;
  gitBusy = action; gitMsg = null; renderGitSlot();
  let ok = false, text = "";
  try {
    const res = await fetch("/api/git/" + action, { method: "POST",
      headers: { "Content-Type": "application/json", "X-AAF-Request": "control-room" }, body: JSON.stringify({ name }) });
    const d = await res.json().catch(() => ({}));
    ok = res.ok && d.ok; text = d.message || "";
  } catch (e) { text = "The dashboard server did not answer."; }
  gitBusy = null;
  if (name !== current) return;
  gitMsg = { ok, text: ok ? (action === "push" ? "Sent to GitHub." : "Got the newest versions from GitHub.")
                          : (action === "push" ? "Push did not work: " : "Pull did not work: ") + text };
  await loadGit(true);
  renderGitSlot();
  loadMap();
}

// ---- Task timeline: where the time went. Data: aaf.py task_stats, sent with /api/project as "tasks".
const TT_VAR = PHASE_VAR;
const TT_DOES = { planning: "Reading the task and deciding how to tackle it.", implementing: "Changing the code.",
  checking: "Running the tests on the latest change.", reviewing: "A second, independent agent reviewed the work.",
  fixing: "Fixing a small point the reviewer raised." };
const TT_SHOWN = 3, TT_GAP = 14, TT_END = 22;  // rows shown before "earlier tasks"; px of a pause break; px kept for the end mark
const TT_X = `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor"/><path d="M6.6 6.6l6.8 6.8M13.4 6.6l-6.8 6.8" stroke="var(--panel)" stroke-width="2.2" stroke-linecap="round"/></svg>`;
const TT_OK = `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor"/><path d="M5.8 10.4l2.9 2.9 5.6-6.4" fill="none" stroke="var(--panel)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const TT_OUT = { done: ["Finished", TT_OK], waiting: ["Waits for your decision", ICON.ask], stuck: ["Stuck", TT_X], running: ["Still running", ""] };
let ttData = null, ttPick = null;

const ttSec = iso => { const t = Date.parse(iso); return isNaN(t) ? null : t / 1000; };
const durWords = s => minutes(Math.max(0, Math.round(s / 60)));
const hhmm = sec => new Date(sec * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
function ttWhen(sec) {
  const d = new Date(sec * 1000), day = new Date(); day.setHours(0, 0, 0, 0);
  const diff = Math.round((day - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 86400000);
  return (diff === 0 ? "today " : diff === 1 ? "yesterday " : d.toLocaleDateString([], { day: "numeric", month: "short" }) + ", ") + hhmm(sec);
}
const phaseWord = e => e.phase || String(e.text || "").split(/[ :(]/)[0].toLowerCase();

// One task as a row of items: a segment per phase, a break wherever work stood still between two phases.
function ttModel(t, now) {
  const items = [], phases = t.phases || [];
  let work = 0, gaps = 0, paused = 0, seen = 0, prevEnd = null;
  phases.forEach((p, i) => {
    const a = ttSec(p.start);
    if (a === null) return;
    const live = t.outcome === "running" && i === phases.length - 1 && !p.end;
    const b = live ? Math.max(now, a) : Math.max(ttSec(p.end) ?? a, a);
    if (prevEnd !== null && a - prevEnd > 0) { items.push({ gap: true, a: prevEnd, b: a, d: a - prevEnd }); gaps++; paused += a - prevEnd; }
    const it = p.iteration || 0;
    let att = 0;
    if (p.phase === "implementing" && it > seen) { if (seen) att = it; seen = it; }
    items.push({ phase: p.phase, it, a, b, d: b - a, att, live });
    work += b - a;
    prevEnd = p.end ? b : null;
  });
  return { items, work, gaps, paused };
}

// What happened in one segment: the events the framework recorded while it lasted.
function ttHappened(m, x) {
  const evs = (ttData && ttData.events) || [];
  const segs = m.items.filter(y => !y.gap);
  const mine = evs.filter(e => {
    const ts = ttSec(e.ts);
    return ts !== null && ts >= x.a && ts <= x.b && segs.find(y => ts >= y.a && ts <= y.b) === x;
  });
  const lines = [];
  for (const e of mine) {
    const text = String(e.text || ""), rest = text.includes(": ") ? text.slice(text.indexOf(": ") + 2) : "";
    if (e.kind === "status") {
      const ph = phaseWord(e);
      if (Math.abs(ttSec(e.ts) - x.a) < 1 && ph === x.phase && rest && !e.task) lines.push(`The agent's note: “${plain(rest)}”`);
      else if (["done", "stuck", "waiting"].includes(ph)) lines.push(`Then: ${ph === "done" ? "the task was finished" : ph === "stuck" ? "it got stuck" : "it waited for your decision"}${rest ? ` (“${plain(rest)}”)` : ""}`);
    } else if (e.kind === "check") {
      const n = /(\d+) of (\d+) passed/.exec(text);
      lines.push(n ? `Tests ran: ${n[1]} of ${n[2]} tests passed` : plain(text));
    } else if (e.kind === "review") {
      const ok = e.verdict ? e.verdict === "pass" : /PASS/.test(text);
      lines.push(`${ok ? "The independent review approved the work" : "The independent review did not approve the work"}${rest ? `: ${plain(rest)}` : ""}`);
    } else if (e.kind === "decision") lines.push(`Decision recorded: ${plain(text)}`);
    else if (e.kind === "draft" && /^Draft saved/.test(text)) lines.push(`Saved an unfinished fix for you to decide on: ${plain(rest.replace(/ \(.*\)$/, ""))}`);
    else if (e.kind !== "git") lines.push(plain(text));
  }
  return lines;
}

function ttDetail(m, x) {
  if (x.gap) {
    const why = ((ttData && ttData.events) || []).filter(e => e.kind === "status" && Math.abs((ttSec(e.ts) ?? -9) - x.a) < 1).map(phaseWord)
      .find(p => ["stuck", "waiting", "done"].includes(p));
    const words = why === "stuck" ? "The agent had got stuck and stopped to wait for you."
      : why === "waiting" ? "The agent had stopped to wait for your decision on an unfinished fix."
      : why === "done" ? "The task had been marked finished." : "No work was recorded.";
    return `<div class="tt-detail" data-seg-detail><p><b>Paused for ${esc(durWords(x.d))}</b></p>
      <p class="tt-dt">${esc(ttWhen(x.a))} – ${esc(ttWhen(x.b))}</p><p>${words} Then work on this task started again.</p></div>`;
  }
  const ph = phaseOf(x.phase), lines = ttHappened(m, x);
  const which = x.it ? (x.phase === "fixing" ? ` · small fix ${x.it}` : ` · attempt ${x.it}`) : "";
  return `<div class="tt-detail" data-seg-detail style="--c:var(${TT_VAR[x.phase] || "--rule"})">
    <p><b>${esc(ph.short)}</b>${which}</p>
    <p class="tt-dt">${esc(ttWhen(x.a))} – ${x.live ? "now" : esc(hhmm(x.b))} · ${esc(durWords(x.d))}${x.live ? " so far" : ""}</p>
    <p>${esc(TT_DOES[x.phase] || ph.doing)}</p>
    ${lines.length ? `<ul>${lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : `<p class="tt-dt" style="margin-top:4px">Nothing else was recorded during this stage.</p>`}</div>`;
}

function timelineHtml() {
  const d = ttData, n = d && d.tasks ? d.tasks.length : 0;
  const head = `<section class="card sec" data-section="timeline" aria-label="Where the time went">
    <div class="ph"><h3>Where the time went</h3><span class="pm">${n ? plural(n, "task") + ", latest on top · tap a bar for detail" : ""}</span></div>`;
  if (!d || d.available === false)
    return head + `<p class="empty" data-empty>The task history cannot be read here: the framework tool that keeps it was not found.</p></section>`;
  const tasks = (d.tasks || []).slice().reverse();
  if (!tasks.length)
    return head + `<p class="empty" data-empty>No task has run yet. Once one has, each task appears here as a bar showing how long it spent planning, changing the code, testing and being reviewed, and how it ended.</p></section>`;
  const now = Date.now() / 1000, models = tasks.map(t => ttModel(t, now));
  const maxWork = Math.max(60, ...models.map(m => m.work)), G = Math.max(0, ...models.map(m => m.gaps));
  const fixed = TT_END + G * (TT_GAP + 4);
  const scaled = f => `calc((100% - ${fixed}px) * ${f.toFixed(5)})`;
  const row = (t, m) => {
    const [words, icon] = TT_OUT[t.outcome] || TT_OUT.running, running = t.outcome === "running";
    let pick = null;
    const items = m.items.map((x, k) => {
      const key = `${t.start}#${k}`, on = ttPick === key;
      if (on) pick = x;
      if (x.gap) return `<button type="button" class="tt-gap" data-gap data-key="${esc(key)}" aria-pressed="${on}" aria-label="Paused for ${esc(durWords(x.d))}" title="Paused for ${esc(durWords(x.d))}"></button>`;
      const label = `${phaseOf(x.phase).short}${x.it && x.phase !== "fixing" ? `, attempt ${x.it}` : ""}: ${durWords(x.d)}`;
      return `<button type="button" class="tt-seg${x.att ? " att" : ""}" data-seg data-key="${esc(key)}" data-phase="${esc(x.phase)}" data-iteration="${x.it}"
        style="--c:var(${TT_VAR[x.phase] || "--rule"});--d:${Math.max(0, x.d)}" aria-pressed="${on}" aria-label="${esc(label)}" title="${esc(label)}">${x.att ? `<span data-attempt-mark aria-hidden="true">${x.att}</span>` : ""}</button>`;
    }).join("");
    const width = `calc((100% - ${fixed}px) * ${(m.work / maxWork).toFixed(5)} + ${m.gaps * (TT_GAP + 4)}px)`;
    const facts = [`started ${ttWhen(ttSec(t.start))}`, t.attempts ? plural(t.attempts, "attempt") : "", m.paused ? `paused ${durWords(m.paused)}` : ""].filter(Boolean).join(" · ");
    const sub = [t.attempts ? plural(t.attempts, "attempt") : "", m.paused ? `paused ${durWords(m.paused)}` : ""].filter(Boolean).join(" · ");
    return `<div class="tt-row" data-task-row data-start="${esc(t.start)}" data-outcome="${esc(t.outcome)}"${running ? " data-running" : ""}>
      <div class="tt-head" data-task-head title="${esc(plain(t.task))} · ${esc(facts)}"><span class="tt-name">${esc(plain(t.task))}</span>
        <span class="tt-sub"><span class="tt-out o-${esc(t.outcome)}" data-outcome-mark>${icon}${words}</span>${sub ? ` · ${esc(sub)}` : ""}</span></div>
      <div class="tt-track"><div class="tt-bar" data-bar style="width:${width}">${items}</div>
        <span class="tt-end o-${esc(t.outcome)}"${running ? " data-running-mark" : ""} aria-hidden="true">${running ? "<span></span>" : icon}</span></div>
      <div class="tt-total" data-total>${esc(durWords(m.work))}</div>
      ${pick ? ttDetail(m, pick) : ""}</div>`;
  };
  const rows = tasks.map((t, i) => row(t, models[i]));
  const older = rows.length > TT_SHOWN ? `<details class="tt-older" data-tt-older${$("[data-tt-older][open]") ? " open" : ""}>
      <summary>${plural(rows.length - TT_SHOWN, "earlier task")}</summary><div class="tt-list">${rows.slice(TT_SHOWN).join("")}</div></details>` : "";
  const step = [1, 2, 5, 10, 15, 30, 60, 120, 180, 240, 360, 720, 1440, 2880].find(s => maxWork / 60 / s <= 5) || 2880;
  const ticks = [];
  for (let mm = 0; mm * 60 <= maxWork; mm += step) ticks.push(`<span style="left:${scaled(mm * 60 / maxWork)}">${mm ? esc(minutes(mm)) : "0"}</span>`);
  const used = Object.keys(TT_VAR).filter(p => tasks.some(t => (t.phases || []).some(x => x.phase === p)));
  const anyGap = models.some(m => m.gaps), anyAtt = models.some(m => m.items.some(x => x.att));
  return head + `<div class="tt-list">${rows.slice(0, TT_SHOWN).join("")}</div>${older}
    <div class="tt-axis" data-axis aria-hidden="true">${ticks.join("")}</div>
    <div class="tt-foot"><div class="tt-legend" data-legend><span>Working time:</span>${used.map(p => `<span data-legend-phase="${p}"><i style="background:var(${TT_VAR[p]})"></i>${esc(phaseOf(p).short)}</span>`).join("")}${
      anyAtt ? `<span class="k-att"><i></i>new attempt</span>` : ""}${anyGap ? `<span class="k-gap"><i></i>paused (not to scale)</span>` : ""}</div>
      </div></section>`;
}

// ---- Change map: where in the code the agent works. Data: aaf.py git files, through /api/files.
const MAP_HIDE = ["state/", "plots/"];          // the framework's own records in every project
const MAP_STEPS = ["1", "2", "3–4", "5–8", "9+"];
const mapStep = n => n >= 9 ? 5 : n >= 5 ? 4 : n >= 3 ? 3 : n >= 2 ? 2 : n >= 1 ? 1 : 0;
const sizeWords = b => b < 1024 ? plural(b, "byte") : `${(b / 1024).toFixed(b < 10240 ? 1 : 0)} KB`;
let mapData = null, mapFor = null, mapPick = null, mapLoading = false, mapShowAll = false;
const WIDE = matchMedia("(min-width: 1200px)");  // the 12-column panel grid
let mapWatch = null;
try { mapShowAll = localStorage.getItem("aaf.mapAll") === "1"; } catch (e) {}

async function loadMap() {
  const name = current;
  if (!name || name === WS) return;
  try {
    const res = await fetch("/api/files?name=" + encodeURIComponent(name));
    if (!res.ok || name !== current) return;
    const d = await res.json();
    if (name !== current) return;
    mapData = d; mapFor = name;
  } catch (e) { return; }
  renderMapSlot();
}

// Squarified treemap (Bruls et al.): lays items with .v into rect r, close to square, sets item.r.
function squarify(items, r) {
  let { x, y, w, h } = r;
  const total = items.reduce((s, it) => s + it.v, 0);
  if (!total || w <= 0 || h <= 0) { items.forEach(it => (it.r = { x, y, w: 0, h: 0 })); return; }
  const k = w * h / total, rest = items.map(it => ({ it, a: it.v * k }));
  const worst = (row, side) => {
    const s = row.reduce((p, q) => p + q.a, 0);
    return Math.max(...row.map(q => Math.max(side * side * q.a / (s * s), s * s / (side * side * q.a))));
  };
  const place = row => {
    const s = row.reduce((p, q) => p + q.a, 0);
    if (w >= h) { const cw = s / h; let cy = y; for (const q of row) { const qh = q.a / cw; q.it.r = { x, y: cy, w: cw, h: qh }; cy += qh; } x += cw; w -= cw; }
    else { const rh = s / w; let cx = x; for (const q of row) { const qw = q.a / rh; q.it.r = { x: cx, y, w: qw, h: rh }; cx += qw; } y += rh; h -= rh; }
  };
  let row = [];
  while (rest.length) {
    const side = Math.min(w, h);
    if (!row.length || worst([...row, rest[0]], side) <= worst(row, side)) row.push(rest.shift());
    else { place(row); row = []; }
  }
  if (row.length) place(row);
}

function mapLayout(files, W, H) {
  const total = files.reduce((s, f) => s + (f.bytes || 0), 0) || 1;
  // Tiny files still get a tile you can tap: at least about 30 x 30 px, or 0.4% of the map.
  const floor = total * Math.max(0.004, 900 / Math.max(1, W * H));
  const groups = new Map();
  for (const f of files) {
    const i = f.path.indexOf("/"), folder = i > 0 ? f.path.slice(0, i) : "";
    if (!groups.has(folder)) groups.set(folder, { folder, files: [], v: 0 });
    const g = groups.get(folder), v = Math.max(f.bytes || 0, floor);
    g.files.push({ f, v, name: i > 0 ? f.path.slice(i + 1) : f.path });
    g.v += v;
  }
  const list = [...groups.values()].sort((a, b) => b.v - a.v);
  squarify(list, { x: 0, y: 0, w: W, h: H });
  for (const g of list) {
    g.files.sort((a, b) => b.v - a.v);
    squarify(g.files, { x: 2, y: 2, w: Math.max(0, g.r.w - 4), h: Math.max(0, g.r.h - 4) });
  }
  return list;
}

function mapShell() {
  const d = mapFor === current ? mapData : null;
  const head = (tg = "") => `<section class="card sec map-card" data-section="changes" aria-label="Where the agent works">
    <div class="ph"><h3>Where the agent works</h3>${tg || `<span class="pm">by how often files changed</span>`}</div>`;
  if (!d) return head() + `<p class="empty">Reading the change history…</p></section>`;
  if (d.available === false)
    return head() + `<p class="empty" data-empty data-map-ready>The change map is not available here: it needs the framework tool, which this workspace does not have.</p></section>`;
  if (d.error)
    return head() + `<p class="empty" data-empty data-map-ready>The change history could not be read just now (${esc(d.error)}). The page tries again every minute.</p></section>`;
  if (!d.repo)
    return head() + `<p class="empty" data-empty data-map-ready>This project is not saved with Git yet, so there is no history of changes to map. Once the agent saves its first version, every file appears here as a tile.</p></section>`;
  const all = d.files || [], shown = mapShowAll ? all : all.filter(f => !MAP_HIDE.some(p => f.path.startsWith(p)));
  const hidden = all.length - shown.length;
  const toggle = hidden || mapShowAll ? `<button type="button" class="map-toggle" data-map-toggle aria-pressed="${!mapShowAll}">${
    mapShowAll ? "Hide its own records" : `Show its own records (${hidden})`}</button>` : "";
  const pick = shown.find(f => f.path === mapPick);
  const detail = pick ? `<div class="map-detail" data-file-detail>
      <p class="path">${esc(pick.path)}</p><p class="sub">${esc(sizeWords(pick.bytes || 0))}</p>
      <p>Changed in ${plural(pick.commits || 0, "saved version")}${pick.lines_changed ? `, ${pick.lines_changed} lines added or removed in total` : ""}.</p>
      ${pick.last_changed ? `<p>Last change: “${esc(pick.last_subject || "")}” · ${esc(clock(pick.last_changed))} (${esc(ago(pick.last_changed))})</p>` : ""}</div>` : "";
  const bytes = shown.reduce((s, f) => s + (f.bytes || 0), 0);
  return head(toggle) + `<div class="map-top"><p class="map-intro" data-map-intro title="Each tile is a file of the project, grouped by folder and sized by how big the file is. The stronger the blue, the more saved versions changed the file.${!mapShowAll && hidden ? " The agent's own records (notes, test results, screenshots) are hidden so the code stands out." : ""}">Tiles are files, sized by how big they are. Tap one for its last change.</p></div>
    ${shown.length ? `<div class="map" data-map data-map-ready role="group" aria-label="Files of the project"></div>`
      : `<p class="empty" data-empty data-map-ready>So far there are only the agent's own records, no code.</p>`}
    ${detail}
    <div class="map-legend" data-map-legend><span>Changed in</span>${MAP_STEPS.map((s, i) => `<span><i class="s${i + 1}"></i>${s}</span>`).join("")}<span>saved versions</span>${shown.some(f => !f.commits) ? `<span><i class="s0"></i>no change in the history read</span>` : ""}<span>${plural(shown.length, "file")}, ${esc(sizeWords(bytes))}</span></div></section>`;
}

function renderMapSlot(focusPath) {
  const slot = $("#map-slot");
  if (!slot) return;
  slot.innerHTML = mapShell();
  const box = $("[data-map]", slot);
  if (box) {
    // In the panel grid the map is a preview that fits the first screen; on its own it gets more room.
    const W = box.clientWidth, H = WIDE.matches ? Math.max(70, box.clientHeight) : Math.round(W < 600 ? Math.min(520, Math.max(300, W * 1.15)) : Math.min(460, Math.max(280, W * 0.45)));
    if (!WIDE.matches) box.style.height = H + "px";
    box.dataset.drawnH = H;
    if (mapWatch) mapWatch.disconnect();
    mapWatch = null;
    if (WIDE.matches && window.ResizeObserver) {
      // Redraw when the row's height changes (e.g. a timeline detail opens), not for the map's own drawing.
      mapWatch = new ResizeObserver(() => { if (box.isConnected && Math.abs(Math.max(70, box.clientHeight) - +box.dataset.drawnH) > 4) renderMapSlot(); });
      mapWatch.observe(box);
    }
    const all = mapData.files || [], shown = mapShowAll ? all : all.filter(f => !MAP_HIDE.some(p => f.path.startsWith(p)));
    box.innerHTML = mapLayout(shown, W, H).map(g => `<div class="map-group" data-group data-folder="${esc(g.folder)}"
        style="left:${g.r.x}px;top:${g.r.y}px;width:${g.r.w}px;height:${g.r.h}px">${g.r.w > 40 && g.r.h > 20 ? `<span class="map-gl">${esc(g.folder ? g.folder + "/" : "top level")}</span>` : ""}${
      g.files.map(t => { const r = t.r, f = t.f, n = f.commits || 0;
        const label = `${f.path}: ${sizeWords(f.bytes || 0)}, changed in ${plural(n, "saved version")}`;
        return `<button type="button" class="map-tile s${mapStep(n)}" data-tile data-path="${esc(f.path)}" data-commits="${n}" data-bytes="${f.bytes || 0}"
          aria-pressed="${mapPick === f.path}" aria-label="${esc(label)}" title="${esc(label)}"
          style="left:${r.x + 1}px;top:${r.y + 1}px;width:${Math.max(2, r.w - 2)}px;height:${Math.max(2, r.h - 2)}px">${
          r.w >= 56 && r.h >= 32 ? `<span class="mn">${esc(t.name)}${r.h >= 48 ? `<span class="ms">${esc(sizeWords(f.bytes || 0))}</span>` : ""}</span>` : ""}</button>`; }).join("")}</div>`).join("");
  }
  slot.querySelectorAll("[data-tile]").forEach(b => b.addEventListener("click", () => {
    mapPick = mapPick === b.dataset.path ? null : b.dataset.path; renderMapSlot(b.dataset.path);
  }));
  // After a tap the map is fully drawn again; keep the keyboard on the same tile, without scrolling.
  if (focusPath) { const t = [...slot.querySelectorAll("[data-tile]")].find(x => x.dataset.path === focusPath); if (t) t.focus({ preventScroll: true }); }
  const tg = $("[data-map-toggle]", slot);
  if (tg) tg.addEventListener("click", () => {
    mapShowAll = !mapShowAll;
    try { localStorage.setItem("aaf.mapAll", mapShowAll ? "1" : "0"); } catch (e) {}
    renderMapSlot();
  });
}
let mapResize = null;
addEventListener("resize", () => { clearTimeout(mapResize); mapResize = setTimeout(() => renderMapSlot(), 150); });

// ---- Track record: how well the agent does over time. Data: aaf.py task_stats (d.tasks) and the
// review history with the server's grouping of why reviews said no (d.record); /api/record for all projects.
const REC_COL = { done: "--pass", waiting: "--accent", stuck: "--fail", running: "--active" };
const REC_SHOWN = 30;   // tasks drawn in the attempts chart; older ones are left out
let recData = null, recPick = null, wsData = null;
const times = n => n === 1 ? "once" : n === 2 ? "twice" : `${n} times`;
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;

function kpi(key, label, value, of, desc, col) {
  return `<div class="kpi${value ? "" : " zero"}" data-kpi="${key}" title="${esc(desc)}">
    <div class="kv">${value}${of !== null ? `<small> of ${of}</small>` : ""}</div><div class="kl">${esc(label)}</div><div class="kd">${esc(desc)}</div>
    ${of !== null ? `<div class="meter" aria-hidden="true"><span style="width:${pct(value, of)}%;background:var(${col})"></span></div>` : ""}</div>`;
}
// aaf.py's "finished" counts every task that ended: finished, stuck or waiting for a decision.
const ended = s => (s.finished || 0) === (s.done || 0) ? "finished tasks" : "tasks that ended (finished, stuck or waiting for you)";
function recKpis(s) {
  return `<div class="kpis" data-rec-kpis>
    ${kpi("first-try", "Right the first time", s.first_try || 0, s.finished || 0, s.finished ? `${ended(s)} where the first attempt passed the tests and the review` : "no task has ended yet", "--pass")}
    ${kpi("rejected", "Review said no", s.review_fails || 0, s.reviews || 0, s.reviews ? "reviews that sent the work back for another attempt" : "no review has happened yet", "--fail")}
    ${kpi("drafts", "Fixes set aside", s.drafts || 0, null, "small fixes the agent could not finish and left for you to decide", "")}
    ${kpi("stuck", "Got stuck", s.times_stuck || 0, null, "times the agent stopped and needed your help", "")}</div>`;
}

function recTrend(tasks, pickable) {
  const shown = tasks.slice(-REC_SHOWN), top = Math.max(3, ...shown.map(t => t.attempts || 0));
  const cols = shown.map(t => {
    const on = pickable && recPick === t.start, a = t.attempts || 0, out = TT_OUT[t.outcome] ? t.outcome : "running";
    const label = `${plain(t.task)}: ${a ? plural(a, "attempt") : "no attempt yet"}, ${(TT_OUT[out] || TT_OUT.running)[0].toLowerCase()}`;
    return `<button type="button" class="col" data-trend-col data-start="${esc(t.start)}" data-attempts="${a}" data-outcome="${esc(out)}"
      style="--c:var(${REC_COL[out]});--h:${(100 * a / top).toFixed(1)}%" aria-pressed="${on}" aria-label="${esc(label)}" title="${esc(label)}"${pickable ? "" : " tabindex=\"-1\""}>
      <span class="n">${a || "–"}</span><span class="b"></span></button>`;
  }).join("");
  const marks = shown.map(t => `<span>${(t.reviews || []).slice(0, 6).map(v => `<i class="${v === "fail" ? "f" : ""}" data-review-mark="${v === "fail" ? "fail" : "pass"}"></i>`).join("")}${
    "<i class=\"dr\" data-draft-mark></i>".repeat(Math.min(3, t.drafts || 0))}${"<i class=\"st\" data-stuck-mark></i>".repeat(Math.min(3, t.times_stuck || 0))}</span>`).join("");
  return `<div class="trend" data-viz="attempts-trend" role="group" aria-label="Attempts per task, oldest first">
    <div class="axis" aria-hidden="true"><span>${top}</span><span>${top % 2 ? "" : top / 2}</span><span>0</span></div>
    <div class="cols">${cols}</div><div class="marks" aria-hidden="true">${marks}</div></div>`;
}

function recLegend(tasks) {
  const outs = [...new Set(tasks.map(t => TT_OUT[t.outcome] ? t.outcome : "running"))];
  const any = k => tasks.some(t => k(t));
  return `<div class="rec-legend" data-rec-legend>${outs.map(o => `<span><i style="background:var(${REC_COL[o]})"></i>${esc(TT_OUT[o][0])}</span>`).join("")}${
    any(t => (t.reviews || []).includes("pass")) ? `<span><i class="dot-p"></i>review approved</span>` : ""}${
    any(t => (t.reviews || []).includes("fail")) ? `<span><i class="dot-f"></i>review said no</span>` : ""}${
    any(t => t.drafts) ? `<span><i class="dr"></i>fix set aside</span>` : ""}${any(t => t.times_stuck) ? `<span><i class="st"></i>got stuck</span>` : ""}</div>`;
}

function recDetail(t, reviews) {
  const a = ttSec(t.start), b = t.end ? ttSec(t.end) : Date.now() / 1000;
  const said = (reviews || []).filter(r => String(r.verdict).toLowerCase() === "fail" && ttSec(r.at) !== null && ttSec(r.at) >= a && ttSec(r.at) <= b + 1);
  const rv = t.reviews || [], fails = rv.filter(v => v === "fail").length;
  const lines = [];
  lines.push(t.first_try ? "Right the first time: the first attempt passed the tests and the review."
    : t.attempts ? `Needed ${plural(t.attempts, "attempt")}.` : "No attempt yet.");
  if (rv.length) lines.push(fails ? `The review said no ${times(fails)}${rv[rv.length - 1] === "pass" ? ", then approved the work" : ""}.` : `The review approved the work${rv.length > 1 ? ` (${plural(rv.length, "review")})` : ""}.`);
  if (t.drafts) lines.push(`Set aside ${plural(t.drafts, "unfinished fix", "unfinished fixes")} for you to decide on.`);
  if (t.times_stuck) lines.push(`Got stuck ${times(t.times_stuck)} and needed your help.`);
  return `<div class="rec-detail" data-trend-detail style="--c:var(${REC_COL[t.outcome] || "--active"})">
    <p><b>${esc(plain(t.task))}</b></p><p class="sub">${esc((TT_OUT[t.outcome] || TT_OUT.running)[0])} · started ${esc(ttWhen(a))}</p>
    <ul>${lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
    ${said.length ? `<p class="sub" style="margin-top:6px">Why the review said no:</p><ul>${said.map(r => `<li>${esc(plain(r.summary))}</li>`).join("")}</ul>` : ""}</div>`;
}

function reasonsHtml(reasons, across, reviews) {
  if (!reasons.length) return `<p class="empty" data-reasons-empty>${reviews === 0 ? "No review has happened yet." : "The review has not said no to any work yet, so there is nothing to sharpen here."}</p>`;
  const max = Math.max(...reasons.map(g => g.count));
  return `<ol class="reasons" data-reasons>${reasons.map((g, i) => {
    const covered = g.covered_in || [], rest = (g.projects || []).filter(p => !covered.includes(p));
    const hint = g.done_item
      ? `<span class="in-done">Your definition of done already asks for this (“${esc(plain(g.done_item))}”), yet the agent still missed it: make that item more specific, or back it with a test.</span>`
      : across && covered.length
      ? `<span class="in-done">The definition of done of ${esc(covered.join(", "))} already asks for this, yet the agent still missed it: make that item more specific, or back it with a test.</span>${
          rest.length ? ` For ${esc(rest.join(", "))}: ${esc(g.advice)}` : ""}`
      : esc(g.advice);
    const where = across && g.projects.length ? ` <span class="in-done">Seen in ${esc(g.projects.join(", "))}.</span>` : "";
    return `<li data-reason="${esc(g.key)}" data-count="${g.count}"><div class="reason-top"><b>${esc(g.label)}</b>
        <span class="reason-bar" aria-hidden="true"><span style="width:${pct(g.count, max)}%"></span></span><span class="rn">${g.count}</span></div>
      <p class="reason-hint">${hint}${where}</p>
      <details ${`data-keep="reason-${across ? "ws-" : ""}${esc(g.key)}"`}${$(`[data-keep="reason-${across ? "ws-" : ""}${g.key}"][open]`) ? " open" : ""}><summary>What the review said (${g.examples.length})</summary>
        <ul>${g.examples.slice(0, 8).map(e => `<li>${esc(plain(e.summary))} <span class="when">· ${across && e.project ? esc(e.project) + ", " : ""}${esc(clock(e.at))}</span></li>`).join("")}</ul></details></li>`;
  }).join("")}</ol>${(() => {
    const total = reasons.reduce((n, g) => n + g.count, 0), rej = reasons[0].rejections || total;
    return total > rej ? `<p class="rec-cap" data-reasons-overlap>Some reviews named more than one reason, so these ${total} add up to more than the ${plural(rej, "time")} the review said no.</p>` : "";
  })()}`;
}

function recordHtml() {
  const st = recData && recData.stats, tasks = (st && st.tasks) || [];
  const head = `<section class="card sec" data-section="record" aria-label="Track record">
    <div class="ph"><h3>Track record</h3><span class="pm">${tasks.length ? plural(tasks.length, "task") : ""}</span></div>`;
  if (!st || st.available === false)
    return head + `<p class="empty" data-empty>The track record cannot be read here: the framework tool that keeps the task history was not found.</p></section>`;
  if (!tasks.length)
    return head + `<p class="empty" data-empty>No task has run yet. After a few tasks, this shows how often the agent gets it right the first time, how often the review says no and why, and whether it needs fewer attempts over time.</p></section>`;
  const s = st.summary || {}, pick = tasks.find(t => t.start === recPick);
  const older = tasks.length > REC_SHOWN ? ` The ${tasks.length - REC_SHOWN} oldest are left out.` : "";
  const reasons = recData.reasons || [];
  return head + `${recKpis(s)}
    <h4 class="rec-h">Attempts per task</h4>
    ${recTrend(tasks, true)}
    <p class="rec-cap">One bar per task, oldest on the left.${s.median_attempts ? ` A task usually takes ${plural(s.median_attempts, "attempt")} before it ends.` : ""}${older} Tap a bar for the task.</p>
    ${recLegend(tasks.slice(-REC_SHOWN))}
    ${pick ? recDetail(pick, recData.reviews) : ""}
    ${reasons.length ? `<details class="rec-why" data-reasons-fold data-keep="rec-why"${$('[data-keep="rec-why"][open]') ? " open" : ""}><summary>Why the review said no (${plural(reasons.length, "reason")})</summary>
      <p class="rec-intro">When the same problem keeps coming back, the project's instructions or its definition of done probably need to be sharper.</p>
      ${reasonsHtml(reasons, false)}</details>` : `<div class="rec-why">${reasonsHtml(reasons, false, s.reviews || 0)}</div>`}</section>`;
}

function renderRecordSlot() {
  const slot = $("#rec-slot");
  if (!slot) return;
  slot.innerHTML = recordHtml();
  slot.querySelectorAll("[data-trend-col]").forEach(b => b.addEventListener("click", () => {
    recPick = recPick === b.dataset.start ? null : b.dataset.start; renderRecordSlot();
    const again = $(`#rec-slot [data-trend-col][data-start="${CSS.escape(b.dataset.start)}"]`);
    if (again) again.focus({ preventScroll: true });
  }));
}

// The workspace view: every project's record side by side.
function workspaceHtml(w) {
  const ps = (w.projects || []), withTasks = ps.filter(p => (p.tasks || []).length), none = ps.filter(p => !(p.tasks || []).length);
  const sum = k => withTasks.reduce((n, p) => n + ((p.summary || {})[k] || 0), 0);
  const s = { finished: sum("finished"), done: sum("done"), first_try: sum("first_try"), reviews: sum("reviews"), review_fails: sum("review_fails"),
              drafts: sum("drafts"), times_stuck: sum("times_stuck") };
  const top = (w.reasons || []).find(g => g.key !== "other");
  const lead = !withTasks.length ? "No project has run a task yet."
    : top ? `The review most often says no because: ${top.label.toLowerCase()} (${times(top.count)}${top.projects.length ? `, in ${plural(top.projects.length, "project")}` : ""}). That is the first place to sharpen the instructions.`
    : s.review_fails ? "The review has said no a few times, for varied reasons; see below." : "The review has not said no to any work yet.";
  const trouble = p => ((p.summary || {}).review_fails || 0) + ((p.summary || {}).times_stuck || 0);
  const rows = withTasks.slice().sort((a, b) => trouble(b) - trouble(a) || a.name.localeCompare(b.name)).map(p => {
    const q = p.summary || {}, tasks = p.tasks.slice(-REC_SHOWN), hi = Math.max(3, ...tasks.map(t => t.attempts || 0));
    const extra = [q.drafts ? plural(q.drafts, "fix", "fixes") + " set aside" : "", q.times_stuck ? `stuck ${times(q.times_stuck)}` : ""].filter(Boolean).join(" · ") || "never stuck, nothing set aside";
    return `<div class="ws-row" data-ws-project="${esc(p.name)}" data-trouble="${trouble(p)}">
      <button type="button" class="wn" data-open="${esc(p.name)}">${esc(p.name)}<small>${plural(q.tasks || p.tasks.length, "task")}${q.median_attempts ? ` · usually ${plural(q.median_attempts, "attempt")}` : ""}</small></button>
      <div class="ws-cell" data-ws-first-try>${q.finished ? `<b>${q.first_try || 0} of ${q.finished}</b> right the first time` : "<b>No finished task yet</b>"}
        <div class="meter" aria-hidden="true"><span style="width:${pct(q.first_try || 0, q.finished || 0)}%;background:var(--pass)"></span></div></div>
      <div class="ws-cell" data-ws-rejected>${q.reviews ? `<b>${q.review_fails || 0} of ${q.reviews}</b> reviews said no` : "<b>No review yet</b>"}
        <div class="meter" aria-hidden="true"><span style="width:${pct(q.review_fails || 0, q.reviews || 0)}%;background:var(--fail)"></span></div></div>
      <div class="ws-cell">Attempts per task · ${esc(extra)}
        <div class="spark" data-ws-spark role="img" aria-label="Attempts per task, oldest first: ${tasks.map(t => t.attempts || 0).join(", ")}">${tasks.map(t =>
          `<span style="height:${Math.max(10, 100 * (t.attempts || 0) / hi).toFixed(0)}%;--c:var(${REC_COL[t.outcome] || "--active"})"></span>`).join("")}</div></div></div>`;
  }).join("");
  return `<section class="card sec ws-hero" data-section="ws-summary" aria-label="Track record across all projects">
      <div class="crumb"><span class="pname">All projects</span><span>${plural(ps.length, "project")} · ${plural(withTasks.reduce((n, p) => n + p.tasks.length, 0), "task")}</span></div>
      <h2 class="title">Track record across all projects</h2>
      <p class="ws-lead" data-ws-lead>${esc(lead)}</p>
      ${recKpis(s)}</section>
    <section class="card sec" data-section="ws-projects" aria-label="Project by project"><div class="ph"><h3>Project by project</h3></div>${withTasks.length ? `<div class="ws-rows">${rows}</div>` : `<p class="empty">No project has run a task yet.</p>`}
      ${none.length ? `<p class="ws-none" data-ws-none>No tasks yet: ${esc(none.map(p => p.name).join(", "))}.</p>` : ""}
      ${withTasks.length ? `<p class="rec-cap">Projects with the most rejected reviews and stuck episodes first. Tap a name to open the project.</p>` : ""}</section>
    <section class="card sec" data-section="ws-reasons" aria-label="Why the review said no"><div class="ph"><h3>Why the review said no, across all projects</h3></div>${reasonsHtml(w.reasons || [], true)}</section>`;
}

function renderWorkspace(w) {
  wsData = w;
  fleetFrom(w);
  if (w.available === false) {
    $("#main").innerHTML = `<section class="card sec" data-section="ws-summary"><p class="empty" data-empty>The track record cannot be read here: the framework tool that keeps the task history was not found.</p></section>`;
    return;
  }
  $("#main").innerHTML = workspaceHtml(w);
  $("#main").querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => select(b.dataset.open)));
}

function renderDetail(d) {
  const st = d.status || {}, meta = d.meta || {}, ck = d.checks, rv = d.review;
  const name = meta.name || current, phase = st.phase || "idle", ph = phaseOf(phase);
  gitPhase = phase;
  ttData = d.tasks || null;
  recData = { stats: d.tasks || null, reviews: (d.record || {}).reviews || [], reasons: (d.record || {}).reasons || [] };
  const drafts = d.drafts || [], hist = d.check_history || [], events = d.events || [];
  const steps = (d.activity || []).filter(a => a && typeof a === "object"), now = steps[steps.length - 1];
  const asks = waitingNeedsYou(now, phase), quiet = quietFor(now, phase);
  const asksFor = now && /permission/i.test(String(now.text || "")) ? "your permission" : "your reply";
  const checks = ck && ck.checks ? ck.checks : [];
  const nPass = checks.filter(c => c.passed).length;
  const kept = new Set([...document.querySelectorAll("main details[open][data-keep]")].map(x => x.dataset.keep));
  const open = key => `data-keep="${key}"${kept.has(key) ? " open" : ""}`;

  // Hero: what it is doing, and whether it needs you. Its right half says how far along the task is.
  const tone = asks && ph.tone !== "bad" ? "ask" : ph.tone;
  const needsTone = phase === "stuck" ? "t-bad" : "t-ask";
  const inCode = asks ? ` · Claude Code is waiting for ${asksFor}` : "";
  const needs = needsYou(phase)
    ? `<div class="needs ${needsTone}" data-needs="yes">${ICON.ask}<span>${phase === "stuck" ? "Needs you: it is stuck and waits for your input"
        : drafts.length ? `Needs you: decide what happens to ${plural(drafts.length, "unfinished fix", "unfinished fixes")}` : "Needs you: it is waiting for your decision"}${esc(inCode)}</span></div>`
    : asks
    ? `<div class="needs t-ask" data-needs="yes">${ICON.ask}<span>Needs you in Claude Code: it is waiting for ${asksFor}</span></div>`
    : `<div class="needs" data-needs="no">${ICON.ok}<span>${phase === "done" ? "Nothing needs you. The task is finished"
        : phase === "idle" ? "Nothing needs you. No task is running"
        : quiet !== null ? `Probably nothing needs you, but it has been quiet for ${minutes(quiet)}` : "Nothing needs you. It will keep going on its own"}</span></div>`;
  const doing = phase === "idle" && !st.task && !events.some(e => e.kind === "check") ? "Waiting for its first task" : ph.doing;
  const nowLine = now ? `<p class="now-line k-${kindOf(now)}${asks ? " ask" : ""}" data-now>${kindIcon(kindOf(now))}<span>Right now: <b>${esc(
      now.kind === "waiting" && !asks ? "Idle in Claude Code, ready for a new task" : KIND_WORDS[kindOf(now)])}</b>${tsOf(now) !== null ? ` · ${esc(ago(now.ts))}` : ""}</span>${
      quiet !== null ? `<span class="q">no new step for ${esc(minutes(quiet))}</span>` : ""}</p>` : "";
  const it = st.iteration || 0, maxIt = meta.max_iterations || 0;
  const chip = it ? `<span class="chip" title="An attempt is one change followed by a test run">Attempt ${it}${maxIt ? ` of up to ${maxIt}` : ""}</span>` : "";
  const plan = (d.summary || {}).plan, planOn = plan && plan.total && (!plan.task || !st.task || plan.task === st.task);
  const planSteps = planOn ? (() => {
    // The plan as written by the agent, a window of five steps around the current one.
    const names = plan.steps || [];
    const cur = Math.min(plan.done, plan.total - 1), from = Math.max(0, Math.min(cur - 2, plan.total - 5));
    const rows = [];
    for (let i = from; i < Math.min(plan.total, from + 5); i++) {
      const txt = names[i] ? names[i].text : i === plan.done ? plan.current : "";
      const state = i < plan.done ? "d" : i === plan.done ? "cur" : "";
      rows.push(`<li class="${state}"><b>${i + 1}</b><span aria-hidden="true">${state === "d" ? "✓" : state === "cur" ? "→" : ""}</span><span>${esc(plain(txt || (state === "d" ? "Done" : "Still to do")))}</span></li>`);
    }
    return `<div class="plan-bar" role="img" aria-label="${plan.done} of ${plan.total} plan steps done"><span style="width:${pct(plan.done, plan.total)}%"></span></div>
      <ol class="plan-steps" data-plan>${rows.join("")}</ol>`;
  })() : "";
  const sideMeta = ACTIVE.has(phase) && st.task_started ? `started ${ago(st.task_started)}` : planOn ? `step ${Math.min(plan.done + 1, plan.total)} of ${plan.total}` : "";
  const sideWords = phase === "done" ? "The task is finished. A new task's plan and progress will show here."
    : phase === "idle" ? "No task is running. Once one starts, its plan and progress show here."
    : "The agent has not written down a plan for this task yet, so there is nothing to measure its progress against.";
  const side = `<div class="hero-side" data-slot="estimate">
      <div class="ph"><h3>How far along</h3><span class="pm">${esc(planOn ? `step ${Math.min(plan.done + 1, plan.total)} of ${plan.total}${sideMeta && ACTIVE.has(phase) ? " · " + sideMeta : ""}` : sideMeta)}</span></div>
      ${st.note && st.note !== "Project created" ? `<p class="agent-note">Agent's latest note: “${esc(plain(st.note))}”</p>` : ""}
      ${planSteps || `<p class="est-wait">${esc(sideWords)}</p>`}</div>`;

  // What to do, only when something needs the human. On the panel grid it takes the hero's right half.
  let action = "";
  if (phase === "waiting" || phase === "stuck") {
    const draftCards = drafts.map(x => `<div class="draft">
        <div class="issue">${esc(x.issue)}</div>
        <p>The agent tried to fix this ${plural(x.iterations, "time")}${x.rounds > 1 ? ` over ${x.rounds} rounds` : ""} and did not succeed: ${esc(x.summary)}.</p>
        <span class="safe">${ICON.shield}Your project is safe: it was put back to the last version where every test passed.</span>
        <div class="choices">
          <div class="choice"><b>Let it keep trying</b><span class="why">Another round of attempts, starting from where it stopped.</span>${copyRow(`/draft ${name} continue ${x.id}`)}</div>
          <div class="choice"><b>Drop it, keep a note</b><span class="why">Nothing changes; the problem stays on the list of known issues.</span>${copyRow(`/draft ${name} discard ${x.id}`)}</div>
        </div>
        ${x.notes ? `<details ${open("draft-" + x.id)}><summary>What the agent tried</summary><div class="md">${markdown(x.notes)}</div></details>` : ""}
      </div>`).join("");
    const failing = checks.filter(c => !c.passed).map(c => c.name);
    action = phase === "stuck"
      ? `<section class="card sec action t-bad c6" data-section="action" aria-label="What to do">
          <h3>The agent stopped and needs your help</h3>
          <p class="lead">${meta.max_iterations && (st.iteration || 0) >= meta.max_iterations
              ? `It used all ${meta.max_iterations} attempts it is allowed without getting every test to pass`
              : `It stopped after ${plural(st.iteration || 0, "attempt")} because it kept running into the same problem`}${failing.length ? ` (still failing: ${esc(failing.join(", "))})` : ""}. ${st.note ? `In its words: “${esc(plain(st.note))}”.` : ""}</p>
          <p>${failing.length ? "The failing test's output is in the <em>Tests</em> panel. " : ""}When you know how it should proceed, tell it in Claude Code, for example:</p>
          ${copyRow(`/task ${name} <your guidance or a smaller goal>`)}
          ${draftCards}
        </section>`
      : `<section class="card sec action c6" data-section="action" aria-label="What to do">
          <h3>${drafts.length ? `Decide on ${plural(drafts.length, "unfinished fix", "unfinished fixes")}` : "Waiting for your decision"}</h3>
          <p class="lead">${drafts.length ? "The main task is complete. While tidying up, the agent could not finish the fix below, so it set it aside for you. Copy one of the two commands into Claude Code." : esc(plain(st.note || ""))}</p>
          ${draftCards}
        </section>`;
  }
  if (asks) {
    const card = `<div class="wait-card" data-wait-card>
        <h3>Claude Code is waiting for ${esc(asksFor)}</h3>
        <p class="lead">${esc(stepWords(now, phase))}${now.detail ? `: “${esc(plain(String(now.detail)))}”` : ""}${tsOf(now) !== null ? ` (${esc(ago(now.ts))})` : ""}.
          The agent cannot go on until you answer.</p>
        <p class="how">Switch to Claude Code and answer there. This page only shows what is happening; it cannot answer for you.</p></div>`;
    action = action ? action.replace(/(aria-label="What to do">)/, `$1${card}`)
      : `<section class="card sec action c6" data-section="action" aria-label="What to do">${card}</section>`;
  }

  const glance = `<section class="card sec hero ${action ? "c6 with-action" : "c12"} t-${tone}" data-section="glance" aria-label="At a glance" style="--tone:var(${toneVar(phase, tone)})">
      <div class="hero-main">
        <div class="crumb"><span><span class="pname">${esc(name)}</span>${meta.description ? ` · ${esc(meta.description)}` : ""}</span><span>Updated ${esc(ago(st.updated))} · live</span></div>
        <h2 class="title" data-doing>${esc(doing)}</h2>
        <div class="chips">${chip}${needs}</div>
        ${st.task ? `<p class="task-line" title="${esc(plain(st.task))}"><span class="lbl">Task: </span>${esc(plain(st.task))}</p>` : `<p class="task-line"><span class="lbl">Give it a task in Claude Code to get started.</span></p>`}
        ${nowLine}
        ${loopPicture(st, meta.max_iterations)}
      </div>
      ${side}
    </section>`;

  // Step by step: the step the agent is on, and the few before it.
  const stepRow = a => `<li data-step data-kind="${kindOf(a)}"${a.subagent ? ` data-subagent="${esc(a.subagent)}"` : ""}>
      <span class="kicon k-${kindOf(a)}">${kindIcon(kindOf(a))}</span><span class="stext" title="${esc(stepWords(a, phase))}">${esc(stepWords(a, phase))}${whoBadge(a)}</span>
      <span class="t">${esc(clock(a.ts))}</span></li>`;
  const earlier = steps.slice(0, -1).reverse();
  const live = `<section class="card sec live c5" data-section="live" aria-label="Step by step">
      <div class="ph"><h3>Step by step</h3><span class="pm">${now ? (ACTIVE.has(phase) ? "live" : `last step ${esc(ago(now.ts))}`) : ""}</span></div>${!now
      ? `<p class="empty" data-live-empty>${ACTIVE.has(phase) ? "No steps have arrived yet. They appear here as the agent works in Claude Code (this needs the activity hook)."
          : "No steps yet. Each step the agent takes in Claude Code appears here as it happens."}</p>`
      : `<div class="current k-${kindOf(now)}" data-current-step data-kind="${kindOf(now)}"${now.subagent ? ` data-subagent="${esc(now.subagent)}"` : ""} data-attention="${asks ? "yes" : "no"}">
          <span class="kicon k-${kindOf(now)}">${kindIcon(kindOf(now))}</span>
          <div class="cbody"><div class="ctext">${esc(stepWords(now, phase))}${whoBadge(now)}</div>
            <div class="lbl">${asks ? "Needs you now" : "Latest step"}${tsOf(now) !== null ? ` · ${esc(ago(now.ts))}` : ""}</div>
            ${now.detail && ["command", "test", "web"].includes(now.kind) ? `<details class="cmd" ${open("step-detail")}><summary>Exact command</summary><code>${esc(now.detail)}</code></details>` : ""}</div></div>
        ${quiet !== null ? `<p class="quiet" data-quiet><b>No new step for ${esc(minutes(quiet))}: the feed has gone quiet.</b> It may be busy with one long step, or Claude Code may have stopped; have a look there if it stays like this.</p>` : ""}
        ${earlier.length ? `<ol class="step-list" aria-label="Steps before it, newest first">${earlier.slice(0, RECENT).map(stepRow).join("")}</ol>` : ""}
        ${earlier.length > RECENT ? `<details data-detail="steps" ${open("steps")}><summary>${plural(earlier.length - RECENT, "earlier step")}</summary>
          <ol class="step-list">${earlier.slice(RECENT).map(stepRow).join("").replace(/ data-step /g, " ")}</ol></details>` : ""}`}
    </section>`;

  // Tests: ring chart, each test, the run history as a strip, the independent review and attempts used.
  const TESTS_SHOWN = 5;
  const testLi = c => `<li>${c.passed ? ICON.pass : ICON.fail}<span title="${esc(c.name)}">${esc(c.name)}</span></li>`;
  const listed = checks.length > TESTS_SHOWN ? [...checks.filter(c => !c.passed), ...checks.filter(c => c.passed)] : checks;
  const allGreen = hist.filter(h => h.passed).length;
  const strip = hist.length ? `<div class="history" data-viz="history" role="img" aria-label="${hist.length} test runs, ${allGreen} with every test passing, oldest first">
      <div class="bars">${hist.map(h => `<span class="${h.passed ? "" : "f"}" style="height:${Math.max(12, Math.round(100 * (h.n_total ? h.n_pass / h.n_total : 0)))}%" title="${esc(clock(h.ran_at))}: ${h.n_pass} of ${h.n_total} tests passed"></span>`).join("")}</div>
      <div class="cap">Test runs, oldest first: ${allGreen} of ${hist.length} fully green</div></div>` : "";
  const rvKind = rv ? rv.verdict : "none";
  const lastCls = phase === "done" ? " last-ok" : phase === "stuck" ? " last-bad" : phase === "waiting" ? " last-ask" : "";
  const pipsN = Math.max(maxIt, it);
  const facts = `<div class="facts2">
      <div><div class="fl">Review</div><div class="fv">${reviewBadge(rvKind)}${rvKind === "pass" ? "Approved" : rvKind === "fail" ? "Not approved yet" : "Not reviewed yet"}</div>
        <div class="fs" title="${esc(rv ? rv.summary : "")}">${rv ? esc(ago(rv.at)) + " · " + esc(rv.summary) : "after every test passes"}</div></div>
      <div><div class="fl">Attempts</div>${pipsN ? `<div class="pips" data-viz="attempts" role="img" aria-label="${it} of ${maxIt || it} attempts used">${Array.from({ length: pipsN }, (_, i) =>
          `<span class="${i < it ? "used" + (i === it - 1 ? " last" + lastCls : "") : ""}"></span>`).join("")}</div>` : ""}
        <div class="fs">${it ? `${it}${maxIt ? ` of up to ${maxIt}` : ""} used` : "none yet"}</div></div></div>`;
  const health = !checks.length && !rv && !it
    ? `<section class="card sec health c3" data-section="health" aria-label="Tests and review"><div class="ph"><h3>Tests</h3></div><p class="empty">Nothing to judge yet. Once the agent starts, this shows its tests, the independent review and how many attempts it used.</p></section>`
    : `<section class="card sec health c3" data-section="health" aria-label="Tests and review">
      <div class="ph"><h3>Tests</h3><span class="pm">${ck && ck.ran_at ? `last run ${esc(ago(ck.ran_at))}` : ""}</span></div>
      ${checks.length ? `<div class="ring">${donut(nPass, checks.length)}<div><div class="big">${nPass} / ${checks.length}</div>
        <div class="small">${nPass === checks.length ? "All tests pass" : `${checks.length - nPass} failing`}</div></div></div>
      <ul class="tests">${listed.slice(0, TESTS_SHOWN).map(testLi).join("")}</ul>
      ${listed.length > TESTS_SHOWN ? `<details class="tests-more" ${open("tests-more")}><summary>${plural(listed.length - TESTS_SHOWN, "more test")}</summary><ul class="tests">${listed.slice(TESTS_SHOWN).map(testLi).join("")}</ul></details>` : ""}`
      : `<p class="empty">No tests have run yet. They run after the agent's first change.</p>`}
      ${strip}
      ${facts}
      ${checks.length ? `<details ${open("test-output")}><summary>Show test output</summary>${checks.map(c => `<p class="small"><b>${esc(c.name)}</b> · ran <code>${esc(c.cmd)}</code></p><pre class="out">${esc(c.output || "(no output)")}</pre>`).join("")}</details>` : ""}
      ${rv && rv.report ? `<details ${open("review-report")}><summary>Read the full review</summary><pre class="out">${esc(rv.report)}</pre></details>` : ""}
    </section>`;

  // Pictures the project produced.
  const plots = d.plots.length ? `<section class="card sec c12" data-section="plots" aria-label="Plots">
    <div class="ph"><h3>Pictures from the project</h3><span class="pm">${plural(d.plots.length, "picture")}</span></div><div class="plots">${d.plots.map(p => `<figure class="plot">
      <button type="button" data-file="${esc(p.file)}"><img loading="lazy" alt="${esc(p.file)}" src="/plot?project=${encodeURIComponent(name)}&file=${encodeURIComponent(p.file)}&t=${p.mtime}"></button>
      <figcaption><span>${esc(p.file)}</span><span>${esc(ago(p.mtime))}</span></figcaption></figure>`).join("")}</div></section>` : "";

  // Detail on demand.
  const dec = d.decisions || [];
  const decisions = dec.length ? `<ol class="timeline">${dec.slice().reverse().map(x => `<li>
      <div class="dt">${esc(x.date)}</div><div class="dtitle">${esc(x.title)}</div>${x.body ? `<div class="dbody">${esc(x.body)}</div>` : ""}</li>`).join("")}</ol>`
    : `<p class="empty">No decisions recorded yet.</p>`;
  const kindClass = e => e.kind === "check" ? (/passed:/.test(e.text) || /Checks passed/.test(e.text) ? "good" : "bad")
    : e.kind === "review" ? (/PASS/.test(e.text) ? "good" : "bad")
    : e.kind === "status" && /^Rolled back/.test(e.text) ? "draft" : e.kind === "status" && /^Stuck/.test(e.text) ? "bad" : e.kind === "status" && /^Done/.test(e.text) ? "good" : e.kind;
  const activity = events.length ? `<ul class="activity">${events.slice().reverse().map(e => `<li>
      <span class="t">${esc(clock(e.ts))}</span><span class="k ${esc(kindClass(e))}"></span><span>${esc(plain(e.text))}</span></li>`).join("")}</ul>`
    : `<p class="empty">Nothing has happened yet.</p>`;
  const summ = (title, teaser, n) => `<summary><span><span class="st">${title}</span><span class="teaser">${esc(teaser)}</span></span><span class="n">${n}</span><span class="chev"></span></summary>`;
  const firstLine = (d.progress || "").split("\n").find(l => /^\s*[-*]\s+\S/.test(l) || (/\S/.test(l) && !/^#/.test(l))) || "";
  const more = `<section class="card sec more c12" data-section="details" aria-label="More detail">
      <div class="ph"><h3>More detail</h3></div>
      <details data-detail="decisions" ${open("decisions")}>${summ("Decisions the agent made", dec.length ? "Latest: " + dec[dec.length - 1].title : "None yet", dec.length || "")}<div class="body">${decisions}</div></details>
      <details data-detail="progress" ${open("progress")}>${summ("The agent's notes", firstLine.replace(/^\s*[-*]\s+/, "").replace(/`/g, "") || "Where things stand and what comes next", "")}<div class="body md">${markdown(d.progress || "")}</div></details>
      <details data-detail="activity" ${open("activity")}>${summ("Everything that happened", events.length ? "Latest: " + plain(events[events.length - 1].text) : "Nothing yet", events.length ? plural(events.length, "event") : "")}<div class="body">${activity}</div></details>
    </section>`;

  $("#main").innerHTML = glance + action + live + health + `<div id="rec-slot" class="slot c4"></div><div id="tt-slot" class="slot c8"></div><div id="map-slot" class="slot c4"></div><div id="git-slot" class="slot c12"></div>` + plots + more;
  renderTimelineSlot();
  renderRecordSlot();
  renderGitSlot();
  renderMapSlot();

  $("#main").querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; setTimeout(() => (b.textContent = "Copy"), 1500); }
    catch (e) { b.textContent = "Select and copy"; }
  }));
  $("#main").querySelectorAll(".plot button").forEach(b => b.addEventListener("click", () => {
    const dlg = $("#lightbox"); $("img", dlg).src = $("img", b).src; $("p", dlg).textContent = b.dataset.file; dlg.showModal();
  }));
}
$("#lightbox").addEventListener("click", e => e.currentTarget.close());

function select(name) {
  current = name; lastDetail = "";
  gitData = null; gitFor = null; gitPick = null; gitMsg = null; ttPick = null; recPick = null;
  mapData = null; mapFor = null; mapPick = null;
  try { localStorage.setItem("aaf.project", name); } catch (e) {}
  history.replaceState(null, "", "#p=" + encodeURIComponent(name));
  document.querySelectorAll(".proj").forEach(b => b.setAttribute("aria-current", b.dataset.p === name));
  tick();
}

async function tick() {
  try {
    const list = await (await fetch("/api/projects")).json();
    const sig = JSON.stringify(list);
    if (sig !== lastProjects) { lastProjects = sig; if ((current !== WS || !list.length) && !list.some(p => p.name === current)) current = list[0]?.name || null; renderRail(list); loadFleet(); }
    if (!current) { welcome(); return; }
    if (current === WS) {
      const w = await (await fetch("/api/record")).text();
      if (w !== lastDetail) { lastDetail = w; renderWorkspace(JSON.parse(w)); }
      return;
    }
    const res = await fetch("/api/project?name=" + encodeURIComponent(current));
    if (!res.ok) return;
    const text = await res.text();
    // While a task runs, redraw every 30 s even without new data, so "gone quiet" can appear.
    // Otherwise leave the page alone: a redraw would drop text the reader has selected.
    let running = false;
    try { running = ACTIVE.has((JSON.parse(text).status || {}).phase); } catch (e) {}
    const dsig = running ? text + "|" + Math.floor(Date.now() / 30000) : text;
    if (dsig !== lastDetail) { lastDetail = dsig; renderDetail(JSON.parse(text)); }
    if (gitFor !== current && !gitLoading) { gitLoading = true; loadGit(false).finally(() => { gitLoading = false; }); }
    if (mapFor !== current && !mapLoading) { mapLoading = true; loadMap().finally(() => { mapLoading = false; }); }
  } catch (e) {
    $("#main").innerHTML = `<div class="welcome"><h2>Dashboard server not reachable</h2><p>Start it from the workspace folder with <code>python3 dashboard/server.py</code>, then reload this page.</p></div>`;
  }
}
let gitLoading = false;
tick(); setInterval(tick, 2500);
setInterval(() => { if (!gitBusy) loadGit(false); }, 30000);
setInterval(() => { if (!mapLoading) loadMap(); }, 60000);
setInterval(loadFleet, 60000);
</script>
</body>
</html>
